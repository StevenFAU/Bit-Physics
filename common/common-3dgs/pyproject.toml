[project]
name = "bit-physics-common-3dgs"
version = "0.1.0"
description = "Bit-Physics common-3dgs — Stack-E (Python / NVIDIA Warp) 3D-Gaussian-Splatting common module: GaussianSplatModel (Inria .ply load/save), Camera (view/projection), the deterministic forward EWA-splatting renderer, the RGB-image PNG writer, and the 3dgs-smoke simulator. Vendors the Inria gaussian-splatting reference (NON-COMMERCIAL research license) under references/3DGS-reference/."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "numpy>=2.0",
  # Stack-E NVIDIA Warp runtime. Pinned per §2.18 / the common-warp re-pin
  # discipline (conventions doc § H.4): warp-lang 1.13.0 upstream-latest at
  # 2026-05-28; upper bound to the next major, mirroring common/common-warp.
  "warp-lang>=1.13,<2.0",
  # RGB-image PNG writer (D-D): matplotlib imsave. The established
  # image-writing dependency in the repo (common/common-py[plotting]).
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_3dgs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/common_3dgs"]
mypy_path = "src"
# NVIDIA Warp ships incomplete type stubs: its public functions (wp.init,
# wp.array, wp.int32/float32, wp.array.numpy, ...) are unannotated, so calling
# them trips strict's `no-untyped-call` at the Warp interop boundary. Relax that
# one code (the rest of --strict — untyped-defs, any-returns in our own code,
# etc. — stays enforced); mirrors the Stack-E Warp-interop posture.
disable_error_code = ["no-untyped-call"]

[[tool.mypy.overrides]]
module = [
  "warp", "warp.*",
  "capture", "capture.*",
  "matplotlib", "matplotlib.*",
  "h5py", "h5py.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
  # Strict-warnings posture, mirroring common/common-warp. Warp 1.13.0 emits
  # no Python Warning reaching pytest's gate under -W error (the PCH-tempdir
  # ResourceWarning fires in the interpreter-shutdown finalizer only).
  "error",
]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
