[project]
name = "bit-physics-common-py"
version = "0.0.0"
description = "Bit-Physics common-py — Python-side capture I/O, determinism config, export hooks, plotting, GGUI workaround, and hot-reload for Stack D (Taichi-backed) sims."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "h5py>=3.10",
  "numpy>=2.0",
  "watchfiles>=0.21",
  # Stack-D Taichi runtime — promoted from optional extra to required
  # at sub-phase-taichi-integration per Task 0.3 routing (a). Upper bound
  # tightened per re-pin policy convention (conventions doc § H.4).
  "taichi>=1.7,<2.0",
]

[project.optional-dependencies]
plotting = [
  "matplotlib>=3.8",
]
# Phase-4 WU-E: the PyTorch/Lightning learning harness (common_py.learned). NOT
# eagerly imported by common_py/__init__ — it would force torch+lightning on
# every common_py consumer (common-py's base stack is Taichi). §0.3 SHIFT from
# the plan's "register learned submodule"; import on demand as common_py.learned.
learned = [
  "torch>=2.0",
  "lightning>=2.6,<3.0",
]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/common_py"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "capture", "capture.*",
  "determinism", "determinism.*",
  "h5py", "h5py.*",
  "watchfiles", "watchfiles.*",
  "matplotlib", "matplotlib.*",
  "taichi", "taichi.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
  "error",
  # Taichi 1.7.4 internally calls `locale.getdefaultlocale()` during
  # `ti.init()`, which Python 3.12 deprecates (slated for removal in
  # 3.15). Filter it here so common-py's strict-warnings posture is
  # preserved without coupling to Taichi-upstream's release cadence.
  # Tracked alongside the spec § 4.4 known limitations for Stack D.
  "ignore::DeprecationWarning:taichi.*",
  "ignore:.*locale\\.getdefaultlocale.*:DeprecationWarning",
]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
