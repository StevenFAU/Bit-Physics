[project]
name = "bit-physics-common-py"
version = "0.0.0"
description = "Bit-Physics common-py — Python-side capture I/O, determinism config, export hooks, plotting, GGUI workaround, and hot-reload for Stack D (Taichi-backed) sims."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "h5py>=3.10",
  "numpy>=2.0",
  "watchfiles>=0.21",
]

[project.optional-dependencies]
# Taichi is only required by `set_taichi_deterministic` and the
# hot-reload workflow; the rest of `common_py` works without it. Kept
# optional so Stack B/C developers can install common-py without
# pulling Taichi's CUDA/Vulkan binaries.
taichi = [
  "taichi>=1.7",
]
plotting = [
  "matplotlib>=3.8",
]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/common_py"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "capture", "capture.*",
  "determinism", "determinism.*",
  "h5py", "h5py.*",
  "watchfiles", "watchfiles.*",
  "matplotlib", "matplotlib.*",
  "taichi", "taichi.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
