[project]
name = "bit-physics-common-warp"
version = "0.1.0"
description = "Bit-Physics common-warp — Stack-E (Python / NVIDIA Warp) workspace surface: runtime init + device selection, CPU-bit-deterministic harness, capture I/O, particles/grids/hashgrid, and the hello smoke simulator for Warp-backed sims."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "h5py>=3.10",
  "numpy>=2.0",
  # Stack-E NVIDIA Warp runtime. Pinned per D3 (sub-phase-common-warp-bootstrap
  # plan-drafting) and re-verified at Stage-1a edit time per Convention #8
  # (fresh-at-edit): warp-lang 1.13.0 is upstream-latest at 2026-05-24 (no
  # 1.13.1 / 1.14.x / 2.x shipped since plan-drafting). Upper bound to the next
  # major per the re-pin policy (conventions doc § H.4), mirroring the
  # taichi>=1.7,<2.0 discipline at common/common-py.
  "warp-lang>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_warp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/common_warp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "warp", "warp.*",
  "capture", "capture.*",
  "h5py", "h5py.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
  # Strict-warnings posture. NO Warp-specific bare-form filter is needed:
  # Stage-0 Task 0.3 verified Warp 1.13.0 emits no Python Warning that
  # reaches pytest's gate under -W error / filterwarnings=["error"] (the
  # only Warp warning — a PCH-tempdir ResourceWarning — fires in the
  # interpreter-shutdown finalizer, after the session ends). Contrast
  # common/common-py, which needs `ignore::DeprecationWarning:taichi.*`.
  "error",
]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
