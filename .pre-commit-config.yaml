# Pre-commit configuration for Bit-Physics.
#
# Tag versions verified at Phase 0 Block 1 (2026-05-18) per Convention-8.
# Re-verify at re-install with: gh release view -R <repo>
# See docs/dependencies.md.

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
        # Vendored upstream sources under references/ are read-only and must
        # remain byte-identical to upstream (docs/architecture.md Appendix D
        # § D.8); do not append final newlines to them.
        exclude: ^references/
      - id: trailing-whitespace
        exclude: ^references/
      - id: check-added-large-files
        # 2 GB ceiling. Per spec § 2.7, canonical capture HDF5 payloads
        # are committed. Ceiling history: default 500 KB → Phase 0
        # 10 MB → continuous-CA-rd3d Stage 1 N4 raised to 64 MB to
        # absorb the first 3D capture (RD-3D gray-scott-lambda-64cube-
        # seed42-step2000 ≈ 46 MB) → particle-fluids-sph-water Stage 1
        # R12 routing raises to 1 GB to absorb the first particle-
        # fluids 1M-particle canonical capture at every-100-steps
        # cadence (sph-water dam-break-1M-particles-seed42-step1000
        # at 11 frames × 1M particles × 56 B/particle/frame ≈ 587 MB)
        # → sub-phase-lattice-boltzmann-d3q19 Stage 1 W1 raises to 2 GB
        # to absorb the LBM Poiseuille full-cadence canonical capture
        # (poiseuille-64x32-seed42-step1000 at every-step cadence,
        # depth-3 z-periodic slab, 19 distributions × 8 B × 6,144
        # cells × 1000 frames ≈ 934 MB pre-HDF5-overhead; operator
        # routing prefers full cadence over cadence-routing to honor
        # the Appendix D descriptor exactly and preserve every-step
        # temporal resolution for MMS / diagnostic post-hoc analysis).
        # LFS handles GitHub hosting transparently per .gitattributes;
        # this ceiling is a git-hygiene knob, not a hosting constraint.
        # 2 GB likely covers MPM canonical capture without further
        # raise. Still tripping on accidental multi-GB binary commits.
        args: ["--maxkb=2097152"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        # Vendored upstream sources under references/ are read-only
        # (docs/architecture.md Appendix D § D.8); they must not be linted or
        # reformatted. First Python vendoring is references/3DGS-reference/
        # (Inria gaussian-splatting, phase-3 common-3dgs).
        exclude: ^references/
      - id: ruff-format
        exclude: ^references/

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: cat4-path-line-assertions
        name: integrity Cat 4 (draft-time path:line assertions)
        # Scans staged docs/audits/spec prose for backtick-fenced
        # `path:line` and `path:start-end` citations; HARD_FAILs on
        # unresolved targets. Implementation:
        # tools/integrity/integrity/cat4_draft_time/path_line_assertions.py.
        entry: bash -c 'cd tools/integrity && uv run --no-sync python -m integrity --cat 4 --staged-only --mode strict'
        language: system
        stages: [pre-commit]
        pass_filenames: false
