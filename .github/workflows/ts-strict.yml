name: ts-strict
# TypeScript / WebGPU strict-mode CI. Gated until Block 7 lands
# common/common-ts/. Block 9 (LANDING) flips `if: ${{ false }}` to true.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts-strict:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: common/common-ts/pnpm-lock.yaml

      - name: Install
        working-directory: common/common-ts
        run: pnpm install --frozen-lockfile

      - name: tsc --noEmit
        working-directory: common/common-ts
        run: pnpm tsc --noEmit

      - name: eslint
        working-directory: common/common-ts
        run: pnpm eslint .

      - name: vitest (skip-in-CI tests excluded per spec § 7.8)
        working-directory: common/common-ts
        run: pnpm vitest run

      # Discrete determinism-gate step for visibility (sub-phase-capture-
      # determinism-contract STEP 10 / D4 strict-fanout). Re-runs the
      # content-equivalent contract surface explicitly so CI failures point
      # at the gate by name rather than the catch-all vitest job above.
      - name: Determinism gate (content-equivalent contract)
        working-directory: common/common-ts
        run: |
          pnpm vitest run src/determinism/
          pnpm vitest run examples/hello-physics/hello-physics.test.ts
