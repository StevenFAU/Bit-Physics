name: mutation-testing
# Runs mutmut against tools/testkit/ and tools/integrity/ per
# docs/architecture.md § 2.13. SOFT_WARN on push (informational), HARD_FAIL
# at phase landing only.
#
# Gated until Block 5 ships the mutmut config + run-mutation.sh. Block 9
# activates.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mutation-testing:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync testkit + integrity deps
        run: |
          (cd tools/testkit && uv sync --extra dev)
          (cd tools/integrity && uv sync --extra dev)
      - name: Run mutation testing
        run: bash tools/testkit/mutation/run-mutation.sh --baseline
