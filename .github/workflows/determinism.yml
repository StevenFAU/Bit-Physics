name: determinism
# Runs the content-equivalent determinism contract harness (Python) against
# the testkit harness's own tests AND across each Phase-1 sim's
# test_determinism.py under the harness API. Extended at
# sub-phase-capture-determinism-contract STEP 10 (D4 strict-fanout) to
# operationalize the cross-package sweep template defined at conventions
# doc § B.7 (Python + TypeScript fan-out).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  determinism:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python
        run: uv python install 3.12

      - name: Sync testkit deps
        working-directory: tools/testkit
        run: uv sync --extra dev

      - name: Determinism harness (testkit)
        working-directory: tools/testkit
        run: uv run pytest -W error determinism/tests/

      # Per-sim fan-out: each Phase-1 sim's test_determinism.py invokes
      # run_twice_and_diff against the canonical sim runner under the
      # content-equivalent contract. Per conventions § M.4 N1, packages
      # share a `tests.conftest` import-path namespace; pytest must run
      # one package at a time to avoid the ImportPathMismatchError.
      - name: Determinism gate per-sim fan-out
        run: |
          for pkg in \
              packages/strange-attractors \
              packages/mandelbulb-explorer \
              packages/boids-3d \
              packages/physarum \
              packages/reaction-diffusion-2d \
              packages/reaction-diffusion-3d \
              packages/sph-water \
              packages/sph-multiphase \
              packages/eulerian-smoke \
              packages/lattice-boltzmann-d3q19 \
              packages/mpm-multimaterial \
              packages/pic-flip \
              packages/schrodinger-smoke; do
            echo "=== ${pkg} ==="
            (cd "${pkg}" && uv run pytest tests/test_determinism.py -v)
          done
