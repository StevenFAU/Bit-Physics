name: integrity
# `python -m integrity --all` runs every Cat 1–5 + Cat-X check across the
# whole repo. Gated until Block 5 lands the toolkit; Block 9 activates.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integrity:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync integrity deps
        working-directory: tools/integrity
        run: uv sync --extra dev
      - name: Run integrity --all
        working-directory: tools/integrity
        run: uv run python -m integrity --all
