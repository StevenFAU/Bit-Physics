name: python-strict
# Lint, type-check, and test the Python workspace members in strict mode
# per docs/architecture.md § 7.7 and Appendix G § G.9.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Selective LFS fetch (charter § 4.2 / D6): do NOT fetch all LFS objects
          # at checkout; the only captures this job reads are the legacy-captures
          # corpus, pulled targeted below (~447 MiB vs ~4.85 GiB → ~20× less).
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync testkit workspace deps
        working-directory: tools/testkit
        run: uv sync --extra dev

      - name: ruff (testkit capture + determinism)
        working-directory: tools/testkit
        run: |
          uv run ruff check capture/
          uv run ruff check determinism/

      - name: mypy --strict (testkit capture + determinism)
        working-directory: tools/testkit
        run: |
          uv run mypy --strict capture/
          uv run mypy --strict determinism/

      - name: Selective LFS fetch — legacy-captures corpus only (via R2 when wired)
        # The only captures-reading test under this pytest run is
        # capture/tests/test_legacy_captures_corpus.py, which reads
        # tests/fixtures/legacy-captures/**. Pull exactly that set.
        #
        # R2 routing (lfs-architecture M5 re-characterized to opt-in steady-state,
        # not a one-shot cutover): when the R2_* secrets reach this job (push +
        # same-repo PRs), source tools/lfs/setup-lfs-s3.sh so the pull resolves
        # via Cloudflare R2 (lfs-s3 transfer agent) — keeps the LFS-touching
        # CI off the throttled GitHub-LFS bandwidth (`tools/lfs/README.md` §
        # "trusted-config (per-job / opt-in) model"). When the secrets are
        # absent (fork PRs — GitHub does not propagate secrets to forks), fall
        # through to plain GitHub LFS exactly as before (D4 steady-state
        # fallback per the lfs-architecture AMENDMENT — Stage 1c / M5 block).
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && \
             [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && [ -n "${S3_BUCKET:-}" ]; then
            source tools/lfs/setup-lfs-s3.sh
            echo "lfs fetch route: R2 (lfs-s3 standalone transfer agent)"
          else
            echo "lfs fetch route: GitHub LFS (R2 secrets absent — fork PR or unconfigured)"
          fi
          git lfs pull --include="tests/fixtures/legacy-captures/**"

      - name: pytest -W error + coverage (advisory)
        working-directory: tools/testkit
        run: uv run pytest -W error --cov=capture --cov-report=term --cov-report=xml capture/tests/

      # Discrete determinism-gate step for visibility (sub-phase-capture-
      # determinism-contract STEP 10 / D4 strict-fanout). Runs the
      # content-equivalent contract surface's own test suite under -W error
      # so CI failures point at the gate by name.
      - name: Determinism gate (content-equivalent contract)
        working-directory: tools/testkit
        run: uv run pytest -W error determinism/tests/

  # Interfacial Fluid Lab: f64 number-density SPH oracle and analytic gates.
  test-sph-multiphase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync sph-multiphase workspace deps
        working-directory: packages/sph-multiphase
        run: uv sync --extra dev
      - name: ruff (reference + tests)
        working-directory: packages/sph-multiphase
        run: |
          uv run ruff check sph_multiphase/ tests/
          uv run ruff format --check sph_multiphase/ tests/
      - name: mypy --strict (reference)
        working-directory: packages/sph-multiphase
        run: uv run mypy --strict sph_multiphase/
      - name: pytest (INDSPH, surface, viscosity, analytic, determinism gates)
        working-directory: packages/sph-multiphase
        run: uv run pytest -W error tests/

  # Phase-3 common-3dgs (task-1). Stack-E Warp-backed 3D-Gaussian-Splatting
  # module; lint + type-check + test in strict mode. No LFS needed — the tests
  # generate scenes in-memory (they do not read the legacy-captures corpus).
  # Per § 2.14, pytest runs directly (no `just` indirection).
  test-common-3dgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync common-3dgs workspace deps
        working-directory: common/common-3dgs
        run: uv sync --extra dev

      - name: ruff (src + tests + examples)
        working-directory: common/common-3dgs
        run: |
          uv run ruff check src/ tests/ examples/
          uv run ruff format --check src/ tests/ examples/

      - name: mypy --strict (src)
        working-directory: common/common-3dgs
        run: uv run mypy --strict src/common_3dgs

      - name: pytest -W error
        working-directory: common/common-3dgs
        run: uv run pytest -W error tests/

  # Phase-3 render-similarity (task-2). Net-new tools/testkit/render_similarity/
  # metric module (PSNR / SSIM / LPIPS / ms_ssim shell) + harness "render-
  # similarity" mode dispatcher (tools/testkit/equivalence/__main__.py). Per
  # §2.14, pytest runs directly (no `just` indirection). The bundled lpips
  # v0.1 linear-head weights ship inside the lpips==0.1.4 wheel and are sha256-
  # asserted on first call (R-3 mitigation); the AlexNet/VGG backbone weights
  # download via torchvision into ~/.cache/torch/hub/checkpoints/ on first
  # call and are cached via actions/cache keyed on Python + lpips version
  # (D-WEIGHTS lean: lazy runtime-fetch + CI cache, NOT vendored as LFS blobs).
  test-render-similarity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync testkit workspace deps (with dev extras for pytest + ruff)
        working-directory: tools/testkit
        run: uv sync --extra dev --extra render-similarity

      - name: ruff (render_similarity + equivalence/__main__.py)
        working-directory: tools/testkit
        run: |
          uv run ruff check render_similarity/ equivalence/__main__.py
          uv run ruff format --check render_similarity/ equivalence/__main__.py

      - name: mypy --strict (render_similarity + equivalence/__main__.py)
        working-directory: tools/testkit
        run: uv run mypy --strict render_similarity/ equivalence/__main__.py

      - name: Cache LPIPS / torch.hub pretrained backbone weights
        # D-WEIGHTS lean — lazy runtime-fetch + actions/cache keyed on Python
        # + lpips version. AlexNet (~243 MB) + VGG (~528 MB) backbone weights
        # download via torchvision into ~/.cache/torch/hub/checkpoints/ on
        # first call; the cache step makes subsequent CI runs skip the
        # download (cache HIT → ~ms; cache MISS → first run is slow but
        # not blocking, R-3 mitigation is the bundled-weight sha256 assertion
        # inside the metric module, not the cache).
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: lpips-backbones-py3.12-lpips0.1.4-${{ hashFiles('tools/testkit/uv.lock') }}
          restore-keys: |
            lpips-backbones-py3.12-lpips0.1.4-

      - name: pytest -W error (render-similarity suite)
        working-directory: tools/testkit
        run: uv run pytest -W error render_similarity/tests/

  # Phase 3 task-3 (sub-phase-phase-3-lenia). FIRST per-sim CI job for a
  # Phase-3 SIM (the prior two Phase-3 jobs test-common-3dgs + test-render-
  # similarity are infrastructure). Runs the Stack-D Taichi reference Lenia's
  # tests directly per § 2.14 + § 6.3 M.
  test-lenia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync lenia workspace deps (with dev extras for pytest + ruff)
        working-directory: packages/lenia
        run: uv sync --extra dev

      - name: ruff (lenia src + tests)
        working-directory: packages/lenia
        run: |
          uv run ruff check lenia/ tests/
          uv run ruff format --check lenia/ tests/

      - name: mypy --strict (lenia)
        working-directory: packages/lenia
        run: uv run mypy --strict lenia/

      - name: pytest (lenia suite — strict-warnings via pyproject)
        working-directory: packages/lenia
        # CLI `-W error` would override the pyproject's specific
        # ``ignore:.*locale\.getdefaultlocale.*:DeprecationWarning`` +
        # ``ignore::DeprecationWarning:taichi.*`` filters (CLI -W has
        # higher priority than ``[tool.pytest.ini_options]
        # filterwarnings`` per pytest's reverse-priority warning-filter
        # model). The pyproject's first entry is ``"error"`` so the
        # strict-warnings posture is preserved; specific ignores
        # (locale + taichi DeprecationWarning + SyntaxWarning) are
        # respected. Sister sub-phases that don't need package-
        # specific deprecation ignores keep ``pytest -W error``.
        run: uv run pytest tests/

  # Phase 3 task-3a (sub-phase-phase-3-ising-classical). FIRST Stack-B SIM
  # in Phase 3 (Metropolis-Hastings checkerboard Monte Carlo; NumPy
  # reference is the CI-visible oracle, the WGSL parallel-Metropolis kernel
  # is local-only per spec §7.8). Unlike test-lenia (which instantiates the
  # sim in-process), ising's acceptance tests read the COMMITTED canonical
  # capture at captures/ising-classical-ref/** (LFS-tracked, mirror RD-2D),
  # so this job needs a selective LFS pull of exactly that capture (R2-
  # routed when the secrets are present; GitHub-LFS fallback on fork PRs).
  test-ising-classical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync ising-classical workspace deps (with dev extras for pytest + ruff)
        working-directory: packages/ising-classical
        run: uv sync --extra dev

      - name: ruff (ising-classical src + tests)
        working-directory: packages/ising-classical
        run: |
          uv run ruff check ising_classical/ tests/
          uv run ruff format --check ising_classical/ tests/

      - name: mypy --strict (ising-classical)
        working-directory: packages/ising-classical
        run: uv run mypy --strict ising_classical/

      - name: Selective LFS fetch — ising-classical canonical capture only (via R2 when wired)
        # The acceptance tests read the committed canonical capture at
        # captures/ising-classical-ref/**; pull exactly that set. R2 routing
        # mirrors the python-strict legacy-captures step (lfs-architecture
        # M5 opt-in steady-state); GitHub-LFS fallback when R2 secrets are
        # absent (fork PRs).
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && \
             [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && [ -n "${S3_BUCKET:-}" ]; then
            source tools/lfs/setup-lfs-s3.sh
            echo "lfs fetch route: R2 (lfs-s3 standalone transfer agent)"
          else
            echo "lfs fetch route: GitHub LFS (R2 secrets absent — fork PR or unconfigured)"
          fi
          git lfs pull --include="captures/ising-classical-ref/**"

      - name: pytest (ising-classical suite)
        working-directory: packages/ising-classical
        run: uv run pytest tests/

  test-rigid-body-pedagogical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync articulated-pedagogical workspace deps (with dev extras for pytest + ruff)
        working-directory: packages/articulated-pedagogical
        run: uv sync --extra dev

      - name: ruff (articulated-pedagogical src + tests)
        working-directory: packages/articulated-pedagogical
        run: |
          uv run ruff check articulated_pedagogical/ tests/
          uv run ruff format --check articulated_pedagogical/ tests/

      - name: mypy --strict (articulated-pedagogical)
        working-directory: packages/articulated-pedagogical
        run: uv run mypy --strict articulated_pedagogical/

      - name: Selective LFS fetch — articulated-pedagogical canonical capture only (via R2 when wired)
        # The acceptance tests generate captures in tmp; the committed canonical
        # capture at captures/rigid-body-pedagogical-ref/** is pulled targeted for
        # replay/fixture parity. R2 routing mirrors test-ising-classical
        # (lfs-architecture M5 opt-in); GitHub-LFS fallback when R2 secrets are
        # absent (fork PRs).
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && \
             [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && [ -n "${S3_BUCKET:-}" ]; then
            source tools/lfs/setup-lfs-s3.sh
            echo "lfs fetch route: R2 (lfs-s3 standalone transfer agent)"
          else
            echo "lfs fetch route: GitHub LFS (R2 secrets absent — fork PR or unconfigured)"
          fi
          git lfs pull --include="captures/rigid-body-pedagogical-ref/**"

      - name: pytest (articulated-pedagogical suite)
        working-directory: packages/articulated-pedagogical
        run: uv run pytest tests/

  # Phase 3 task-6 (sub-phase-phase-3-neural-ca). FIRST dual-stack SIM + FIRST
  # cross-stack gate-14 (render-similarity, statistical) of Phase 3. Three jobs
  # per D-CI (charter §6): -train (Stack-D training/golden/PBT), -infer (the
  # WGSL B-inference NumPy-oracle reproduction, the CI-visible check for the
  # local-only WGSL §7.8), -equiv (the D↔B render-similarity gate-14). Each does
  # a selective LFS pull for its capture(s)/artifact(s) (test-ising-classical
  # precedent). WGSL inference is NEVER run in CI (§7.8) — CI reads committed
  # captures.
  test-neural-ca-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync neural-ca workspace deps (with dev extras for pytest + ruff)
        working-directory: packages/neural-ca/python
        run: uv sync --extra dev

      - name: ruff (neural-ca src + tests)
        working-directory: packages/neural-ca/python
        run: |
          uv run ruff check neural_ca/ tests/
          uv run ruff format --check neural_ca/ tests/

      - name: mypy --strict (neural-ca)
        working-directory: packages/neural-ca/python
        run: uv run mypy neural_ca/

      - name: Selective LFS fetch — neural-ca checkpoint only (via R2 when wired)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && \
             [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && [ -n "${S3_BUCKET:-}" ]; then
            source tools/lfs/setup-lfs-s3.sh
            echo "lfs fetch route: R2 (lfs-s3 standalone transfer agent)"
          else
            echo "lfs fetch route: GitHub LFS (R2 secrets absent — fork PR or unconfigured)"
          fi
          git lfs pull --include="tools/testkit/golden/checkpoints/**"

      - name: pytest (neural-ca train + golden + PBT)
        working-directory: packages/neural-ca/python
        run: uv run pytest tests/test_train_convergence.py tests/test_checkpoint_serialization.py tests/test_golden_anchors.py tests/test_pbt_invariants.py

  test-neural-ca-infer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync neural-ca workspace deps
        working-directory: packages/neural-ca/python
        run: uv sync --extra dev

      - name: Selective LFS fetch — WGSL artifact + B-inference capture (via R2 when wired)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && \
             [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && [ -n "${S3_BUCKET:-}" ]; then
            source tools/lfs/setup-lfs-s3.sh
            echo "lfs fetch route: R2 (lfs-s3 standalone transfer agent)"
          else
            echo "lfs fetch route: GitHub LFS (R2 secrets absent — fork PR or unconfigured)"
          fi
          git lfs pull --include="tools/testkit/golden/checkpoints/**"
          git lfs pull --include="captures/neural-ca-ref/**"

      - name: pytest (neural-ca WGSL-inference reproduction — NumPy oracle vs committed WGSL capture)
        working-directory: packages/neural-ca/python
        run: uv run pytest tests/test_wgsl_inference_reproduction.py

  test-neural-ca-equiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync neural-ca workspace deps
        working-directory: packages/neural-ca/python
        run: uv sync --extra dev

      - name: Cache LPIPS / torch.hub pretrained backbone weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: lpips-backbones-py3.12-lpips0.1.4-${{ hashFiles('tools/testkit/uv.lock') }}
          restore-keys: |
            lpips-backbones-py3.12-lpips0.1.4-

      - name: Selective LFS fetch — D + B inference captures (via R2 when wired)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && \
             [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && [ -n "${S3_BUCKET:-}" ]; then
            source tools/lfs/setup-lfs-s3.sh
            echo "lfs fetch route: R2 (lfs-s3 standalone transfer agent)"
          else
            echo "lfs fetch route: GitHub LFS (R2 secrets absent — fork PR or unconfigured)"
          fi
          git lfs pull --include="captures/neural-ca-ref/**"

      - name: pytest (neural-ca gate-14 D↔B render-similarity, statistical)
        working-directory: packages/neural-ca/python
        run: uv run pytest tests/test_cross_stack_equivalence.py

  # Phase 3 task-7 (sub-phase-phase-3-pinn-poisson). FIRST learned-dynamics-CATEGORY
  # sim — a soft-constraint Raissi-2019 PINN solving the 2D Poisson equation, Stack E
  # (Warp substrate) + PyTorch, CPU-only. ALWAYS-ON FAST TIER (CI-hardening, L-PINN-2):
  # ruff + mypy + the analytic-core, classical-FD, and CHECKPOINT-LOADING gates — these
  # load the committed checkpoint and prove it reproduces the analytic anchor +
  # FD reference + PBT envelopes in SECONDS (no re-train), so they gate EVERY push.
  # The iteration-heavy full re-train + EFECT + cross-hardware convergence is the
  # path-filtered `pinn-train.yml` job (fires only on PINN training-code changes).
  test-pinn-poisson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync pinn-poisson workspace deps (with dev extras for pytest + ruff)
        working-directory: packages/pinn-poisson
        run: uv sync --extra dev

      - name: ruff (pinn-poisson src + tests)
        working-directory: packages/pinn-poisson
        run: |
          uv run ruff check pinn_poisson/ tests/
          uv run ruff format --check pinn_poisson/ tests/

      - name: mypy --strict (pinn-poisson)
        working-directory: packages/pinn-poisson
        run: uv run mypy --strict pinn_poisson/

      - name: Selective LFS fetch — committed PINN checkpoint (via R2 when wired)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && \
             [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && [ -n "${S3_BUCKET:-}" ]; then
            source tools/lfs/setup-lfs-s3.sh
            echo "lfs fetch route: R2 (lfs-s3 standalone transfer agent)"
          else
            echo "lfs fetch route: GitHub LFS (R2 secrets absent — fork PR or unconfigured)"
          fi
          git lfs pull --include="tools/testkit/golden/checkpoints/**"

      - name: Assert the committed checkpoint smudged (no silent-skip of the gates)
        run: |
          CKPT=tools/testkit/golden/checkpoints/pinn-poisson-mms-seed42.safetensors
          SZ=$(stat -c%s "$CKPT" 2>/dev/null || echo 0)
          if [ "$SZ" -le 1024 ]; then
            echo "::error::checkpoint not smudged ($CKPT is $SZ bytes — LFS pull failed); the always-on inference gates would silently skip"
            exit 1
          fi
          echo "checkpoint smudged: $SZ bytes"

      - name: pytest (always-on fast — analytic + FD + committed-checkpoint inference/PBT)
        working-directory: packages/pinn-poisson
        run: uv run pytest tests/test_analytic_problems.py tests/test_fd_reference.py tests/test_checkpoint_inference.py

