          uv run ruff format --check gs_mpm/ tests/

      - name: mypy --strict (3dgs-mpm)
        working-directory: packages/3dgs-mpm
        run: uv run mypy --strict gs_mpm/

      - name: Selective LFS fetch — committed golden render PNGs (via R2 when wired)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && \
             [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && [ -n "${S3_BUCKET:-}" ]; then
            source tools/lfs/setup-lfs-s3.sh
            echo "lfs fetch route: R2 (lfs-s3 standalone transfer agent)"
          else
            echo "lfs fetch route: GitHub LFS (R2 secrets absent — fork PR or unconfigured)"
          fi
          git lfs pull --include="tools/testkit/golden/renders/**"

      - name: Assert the committed golden renders smudged (no silent-skip of Prong 2)
        run: |
          PNG=tools/testkit/golden/renders/3dgs-mpm-canonical-frame-0.png
          SZ=$(stat -c%s "$PNG" 2>/dev/null || echo 0)
          if [ "$SZ" -le 256 ]; then
            echo "::error::golden render not smudged ($PNG is $SZ bytes — LFS pull failed); the render-similarity gate would silently skip"
