name: cpp-strict
# Build + test the Stack-C (C++ / Vulkan) common-cpp surface under the lavapipe
# determinism pin. Charter sub-phase-common-cpp-bootstrap § 4 (S-CPPB5): the
# first CI that exercises the C++/Vulkan path — lavapipe + cmake + ctest, incl.
# the C-6 cross-language interop check (Python testkit reads the C++-emitted .h5).
#
# R-CPPB2 caveat (FACT — banked S1c-CPPB1): the determinism contract is
# same-host-same-build. The exact-digest assertions (C-2/C-3 reproducing the
# Stage-0 contracted baseline a7f85bd4… and the NoContraction digest 48c92e95…)
# hold for the dev-pinned Mesa 25.2.8 / LLVM 20.1.2. A runner with a DIFFERENT
# Mesa/LLVM build may diverge on the FMA-contracted digest (the NoContraction
# path is the more portable IEEE-754 RTE path). If this job is red on the
# digest tests, that is the expected R-CPPB2 cross-build divergence, not a
# substrate defect — pin Mesa (container) or relax to 2-run-determinism-only
# (banked follow-up). Local dev verification (5/5 ctests) is the landing bar;
# this remote run is operator-observed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Selective LFS fetch (charter § 4.2 / D6): cpp-strict reads NO committed
          # capture — its smoke binaries write runtime .h5 and the C-6 interop ctest
          # reads a C++-emitted .h5 generated at test time. So fetch no LFS objects.
          lfs: false

      - name: Install C++ / Vulkan / HDF5 toolchain (lavapipe pin)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ \
            mesa-vulkan-drivers vulkan-tools libvulkan-dev \
            glslang-tools \
            libhdf5-dev

      - name: Install uv (for the C-6 cross-language interop ctest)
        uses: astral-sh/setup-uv@v8.1.0

      - name: Sync testkit workspace deps (capture + equivalence)
        working-directory: tools/testkit
        run: uv sync --extra dev

      - name: Probe lavapipe selection
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: vulkaninfo --summary | grep -iE "deviceName|driverName" || true

      - name: Configure (top-level CMake)
        run: cmake -S . -B build/cpp

      - name: Build
        run: cmake --build build/cpp -j"$(nproc)"

      - name: ctest (substrate C-3, determinism C-2, capture C-1, smoke C-4, interop C-6)
        # The Vulkan/determinism/smoke tests set the lavapipe env (VK_DRIVER_FILES +
        # LP_NUM_THREADS=0) via CTest properties; the interop ctest runs uv from
        # tools/testkit. See the R-CPPB2 caveat in the header for digest-exact tests.
        run: ctest --test-dir build/cpp --output-on-failure
