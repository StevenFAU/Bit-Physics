name: cpp-strict
# Build + test the Stack-C (C++ / Vulkan) common-cpp surface under the lavapipe
# determinism pin. Charter sub-phase-common-cpp-bootstrap § 4 (S-CPPB5): the
# first CI that exercises the C++/Vulkan path — lavapipe + cmake + ctest, incl.
# the C-6 cross-language interop check (Python testkit reads the C++-emitted .h5).
#
# R-CPPB2 caveat (FACT — banked S1c-CPPB1): the determinism contract is
# same-host-same-build. The exact-digest assertions (C-2/C-3 reproducing the
# Stage-0 contracted baseline a7f85bd4… and the NoContraction digest 48c92e95…)
# hold for the dev-pinned Mesa 25.2.8 / LLVM 20.1.2. A runner with a DIFFERENT
# Mesa/LLVM build may diverge on the FMA-contracted digest (the NoContraction
# path is the more portable IEEE-754 RTE path). If this job is red on the
# digest tests, that is the expected R-CPPB2 cross-build divergence, not a
# substrate defect — pin Mesa (container) or relax to 2-run-determinism-only
# (banked follow-up). Local dev verification (5/5 ctests) is the landing bar;
# this remote run is operator-observed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Selective LFS fetch (charter § 4.2 / D6): do NOT fetch all LFS objects at
          # checkout. The common-cpp tests need none (they write/read runtime .h5), but
          # the RD-2D-Stack-C ctests read ONE committed reference capture — pulled
          # targeted after the build (see the "Selective LFS fetch" step below).
          lfs: false

      - name: Install C++ / Vulkan / HDF5 toolchain (lavapipe pin)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ \
            mesa-vulkan-drivers vulkan-tools libvulkan-dev \
            glslang-tools \
            libhdf5-dev

      - name: Install uv (for the C-6 cross-language interop ctest)
        uses: astral-sh/setup-uv@v8.1.0

      - name: Sync testkit workspace deps (capture + equivalence)
        working-directory: tools/testkit
        run: uv sync --extra dev

      - name: Probe lavapipe selection
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: vulkaninfo --summary | grep -iE "deviceName|driverName" || true

      - name: Configure (top-level CMake)
        run: cmake -S . -B build/cpp

      - name: Build
        run: cmake --build build/cpp -j"$(nproc)"

      - name: Selective LFS fetch — RD-2D reference capture (gate-14 cross-stack, via R2 when wired)
        # Stage-1b finding correction: the RD-2D-Stack-C ctests (rd2d_stack_c_tests,
        # rd2d_stack_c_gate14) DO read a committed canonical capture
        # (captures/reaction-diffusion-2d-ref/gray-scott-lambda-128sq-seed42-step2000.h5)
        # via packages/reaction-diffusion-2d-stack-c/tests/python/test_gate14_cross_stack.py.
        # The probe / charter § 4.1 ("cpp-strict needs zero captures") was wrong. Pull
        # exactly that narrow set (still ~20×+ less than a full lfs: true fetch).
        #
        # R2 routing: when the R2_* secrets reach this job (push + same-repo PRs),
        # source tools/lfs/setup-lfs-s3.sh so the pull resolves via Cloudflare R2
        # (lfs-s3 transfer agent — `tools/lfs/README.md` § "trusted-config
        # (per-job / opt-in) model"). When the secrets are absent (fork PRs), fall
        # through to plain GitHub LFS (D4 steady-state fallback per
        # `sub-phase-lfs-architecture.md` AMENDMENT — Stage 1c / M5).
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && \
             [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && [ -n "${S3_BUCKET:-}" ]; then
            source tools/lfs/setup-lfs-s3.sh
            echo "lfs fetch route: R2 (lfs-s3 standalone transfer agent)"
          else
            echo "lfs fetch route: GitHub LFS (R2 secrets absent — fork PR or unconfigured)"
          fi
          # mass-spring-cloth (task-5): the cloth ctests (mass_spring_cloth_tests
          # golden + mass_spring_cloth_pbt) GENERATE their own runs and read no
          # committed capture; the canonical flag-wind-128x128 capture is pulled
          # here so a future replay/validation ctest (gate-9) finds it locally.
          git lfs pull --include="captures/reaction-diffusion-2d-ref/**,captures/mass-spring-cloth-ref/**"

      - name: ctest (substrate C-3, determinism C-2, capture C-1, smoke C-4, interop C-6, cloth gate-3/4/11)
        # The Vulkan/determinism/smoke tests set the lavapipe env (VK_DRIVER_FILES +
        # LP_NUM_THREADS=0) via CTest properties; the interop + cloth-PBT ctests run
        # uv from tools/testkit. The mass-spring-cloth acceptance/golden/PBT ctests
        # run in this same job (D-CI: mirror the RD-2D-Stack-C shape — ctests in the
        # one cpp-strict job, no separate per-sim job). See the R-CPPB2 caveat for
        # digest-exact tests.
        run: ctest --test-dir build/cpp --output-on-failure
