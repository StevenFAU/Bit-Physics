name: equivalence
# Runs Block 3's cross-stack equivalence harness against stub stacks and
# (post-Phase-2) cross-stack ports. Gated until Block 3 lands;
# Block 9 activates.

on:
  push:
    branches: [main]
  pull_request:

# Runner image pinned, not ubuntu-latest: this job needs only uv's Python, but
# ubuntu-latest moved to 26.04 in 2026-10 and broke python-strict, cpp-strict
# and the web-deploy browser gate. Move images deliberately, all workflows together.
jobs:
  equivalence:
    if: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync testkit deps
        working-directory: tools/testkit
        run: uv sync --extra dev
      - name: Run equivalence harness
        working-directory: tools/testkit
        run: uv run pytest -W error equivalence/tests/
