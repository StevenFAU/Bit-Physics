name: binary-release
# Phase 5 sub-phase 5.2 — build-and-validate native binaries for every qualifying
# Stack-C (C++ / Vulkan) sim, re-verifying correctness via the spec § 3.8 bootstrap
# gate (clean CMake build → run the headless capture binary → compare_captures
# round-trip / in-binary witness + PBT surrogate). Build steps mirror cpp-strict.yml
# (the green Stack-C build precedent). The `deploy` job (un-gated at the post-phase-5
# housekeeping sweep, operator-ratified 2026-06-10, mirroring the web-deploy Pages
# un-gating; it was GATED OFF through Phase 5) publishes a GitHub Release on
# OPERATOR-CONTROLLED workflow_dispatch only (confirm_release=true). It attaches the
# SAME validated binaries the build-and-validate matrix produced in the same run —
# never rebuilt, never re-fetched from elsewhere — with their sha256 digests in the
# release body. The release attaches to the EXISTING operator-pushed v0.5.0-phase-5
# tag: creating a release on an existing tag is the ratified I7 carve-out; this
# workflow never creates or pushes a tag. Publishing adds no new verification claims.
#
# §0.3 SHIFT — OS scope: the bootstrap gate is lavapipe-pinned (D14/D4, software
# Vulkan determinism) and validated on ubuntu-latest, mirroring cpp-strict's
# ubuntu-only posture. Windows + macOS binary builds (per-OS software-Vulkan
# device + the R-CPPB2 cross-build determinism story) are DEFERRED-to-Phase-6,
# documented in docs/productization/binary-release.md § go-live. We do not add
# untested win/mac matrix cells that would fake-pass.

on:
  push:
    tags: ['bin-v*']
  pull_request:
    paths:
      - 'tools/productization/binary-release/**'
      - '.github/workflows/binary-release.yml'
      - 'packages/**/CMakeLists.txt'
      - 'cmake/Packaging.cmake'
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Set to "true" to publish the GitHub Release after a green validate matrix (operator-controlled).'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: binary-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover qualifying Stack-C CMake sims
    runs-on: ubuntu-latest
    outputs:
      sims: ${{ steps.disc.outputs.sims }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Discover (CMake-capture pool; § 6.2 — own-§13 opt-out)
        id: disc
        run: |
          uv run python tools/productization/binary-release/pipeline.py discover --json > sims.json
          cat sims.json
          NAMES=$(uv run python -c "import json,sys; print(json.dumps([s['name'] for s in json.load(open('sims.json'))]))")
          echo "sims=$NAMES" >> "$GITHUB_OUTPUT"

  build-and-validate:
    name: Build and validate (${{ matrix.sim }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sim: ${{ fromJson(needs.discover.outputs.sims) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false

      - name: Install C++ / Vulkan / HDF5 toolchain (lavapipe pin — mirrors cpp-strict)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ \
            mesa-vulkan-drivers vulkan-tools libvulkan-dev \
            glslang-tools \
            libhdf5-dev

      - name: Install uv (for the programmatic compare_captures + PBT drivers)
        uses: astral-sh/setup-uv@v8.1.0

      - name: Sync testkit workspace deps (capture + equivalence + property)
        working-directory: tools/testkit
        run: uv sync --extra dev

      - name: Probe lavapipe selection
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: vulkaninfo --summary | grep -iE "deviceName|driverName" || true

      - name: Lint CMakeLists (§ 6.2; posture divergence is SHIFTED, not fail)
        run: |
          CML="packages/${{ matrix.sim }}/CMakeLists.txt"
          uv run python tools/productization/binary-release/lint.py "$CML" || true

      - name: Selective LFS fetch — committed canonical captures (R2 when wired)
        # Mirrors cpp-strict.yml / python-strict.yml: source the lfs-s3 agent when the
        # R2_* secrets reach this job (push + same-repo PRs); fall through to GitHub
        # LFS for fork PRs. The capture_roundtrip sim reads a committed .h5 canonical;
        # the cloth witness/PBT surrogate generates its own runs.
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && \
             [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && [ -n "${S3_BUCKET:-}" ]; then
            source tools/lfs/setup-lfs-s3.sh
            echo "lfs fetch route: R2"
          else
            echo "lfs fetch route: GitHub LFS"
          fi
          git lfs pull --include="captures/reaction-diffusion-2d-stack-c/**,captures/mass-spring-cloth-ref/**" \
            || echo "no LFS captures pulled (surrogate sim)"

      - name: Build + bootstrap-validate (§ 3.8 gate)
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          LP_NUM_THREADS: '0'
        run: |
          cd tools/testkit
          uv run python ../../tools/productization/binary-release/pipeline.py validate \
            --artifacts "${{ runner.temp }}/artifacts" --sim "${{ matrix.sim }}" --json \
            > "${{ runner.temp }}/result.json"
          cat "${{ runner.temp }}/result.json"

      - name: Surface result
        if: always()
        run: cat "${{ runner.temp }}/result.json" || true

      - name: Upload capture binary
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-release-${{ matrix.sim }}
          path: ${{ runner.temp }}/artifacts/${{ matrix.sim }}/build/packages/${{ matrix.sim }}/*_capture
          retention-days: 30
          if-no-files-found: warn

  deploy:
    name: Publish GitHub Release (operator-dispatched; confirm_release=true)
    needs: build-and-validate
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish a GitHub Release with binaries attached (§ 4.3)
    steps:
      # Go-live (2026-06-10). Linux x86_64 only (the validated matrix; Windows/
      # macOS are Phase-6 — the old macOS quarantine note moves with them, see
      # docs/productization/binary-release.md § go-live runbook).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-release-*
          path: dist
      - name: Stage assets, compute sha256 digests, compose release body
        run: |
          set -euo pipefail
          mkdir -p assets
          for d in dist/binary-release-*/; do
            for f in "$d"*_capture; do
              test -f "$f" || { echo "no capture binary under $d" >&2; exit 1; }
              cp "$f" "assets/$(basename "$f")-linux-x86_64"
            done
          done
          n=$(ls assets | wc -l)
          test "$n" -ge 2 || { echo "expected >=2 staged binaries, got $n" >&2; exit 1; }
          (cd assets && sha256sum -- * > SHA256SUMS)
          echo "staged:"; cat assets/SHA256SUMS
          {
            echo "## Stack-C native capture binaries (Phase-5 deliverables)"
            echo
            echo "Built and § 3.8 bootstrap-validated (clean CMake build → headless capture"
            echo "run → compare_captures round-trip / witness + PBT surrogate, Mesa lavapipe"
            echo "software Vulkan) in THIS workflow run — run \`${{ github.run_id }}\` on"
            echo "build SHA \`${{ github.sha }}\`, a post-close housekeeping head. The Phase-5"
            echo "close itself is the tag this release attaches to (\`v0.5.0-phase-5\` ="
            echo "\`922a850\`). The attached assets are the SAME artifacts the validate matrix"
            echo "produced in this run: never rebuilt, never re-fetched from elsewhere."
            echo
            echo "**Scope (honest):** 2 qualifying Stack-C (C++/Vulkan) sims, Linux x86_64,"
            echo "CPU-tier headless capture binaries. The full 7-sim browser-WebGPU set is"
            echo "served at https://stevenfau.github.io/Bit-Physics/. Windows/macOS builds"
            echo "are DEFERRED-to-Phase-6 (binary-release.md § go-live)."
            echo
            echo "**sha256 digests** (also attached as \`SHA256SUMS\`; mirrored in the audit"
            echo "ledger under \`docs/_audits/phase-5/\`):"
            echo
            echo '```'
            cat assets/SHA256SUMS
            echo '```'
            echo
            echo "Publishing adds NO new verification claims: the gates that validated these"
            echo "binaries are unchanged, and their record is the append-only audit ledger."
          } > release-body.md
      - name: Publish GitHub Release on the existing v0.5.0-phase-5 tag (I7 carve-out — no tag created)
        uses: softprops/action-gh-release@aec2ec56f94eb8180ceec724245f64ef008b89f5 # v2.4.0 (tag SHA verified against softprops/action-gh-release via the public API at go-live; the prior pin c95fe148 was v2.2.1 mislabeled as v2.4.0 — caught by this re-verification)
        with:
          tag_name: v0.5.0-phase-5
          name: "v0.5.0-phase-5 — Phase-5 close · Stack-C binaries"
          body_path: release-body.md
          draft: false
          make_latest: "true"
          fail_on_unmatched_files: true
          files: assets/*
