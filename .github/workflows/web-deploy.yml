name: web-deploy
# Phase 5 sub-phase 5.1 — build-and-validate the 7 Stack-B WebGPU web frontends and
# re-verify each through a REAL headless browser: Vite build → headless Chromium with
# WebGPU (Mesa lavapipe Vulkan) → drive the capture-export hook → re-apply the sim's
# OWN established gate (web-build track) to the BROWSER-emitted capture (verify.py).
# This is the workflow whose green specifically proves browser delivery (the web-build
# track validated the shaders only on wgpu-native). NO tolerance is added or widened.
# The `deploy` job (un-gated at the post-phase-5 housekeeping sweep, operator-ratified
# 2026-06-10; it was GATED OFF through Phase 5) publishes to GitHub Pages on
# OPERATOR-CONTROLLED workflow_dispatch only (confirm_deploy=true). It assembles the
# SAME validated bundles the build-and-validate matrix produced in the same run plus a
# static landing page — deploy publishes already-validated bundles and adds no new
# verification claims. Push-trigger deploys are a later, separate decision.

on:
  push:
    tags: ['web-v*']
  pull_request:
    paths:
      - 'tools/productization/web-deploy/**'
      - '.github/workflows/web-deploy.yml'
      - 'packages/**/web/**'
      - 'common/common-web/**'
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Set to "true" to publish to GitHub Pages after a green validate matrix (operator-controlled).'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover qualifying sims
    runs-on: ubuntu-latest
    outputs:
      sims: ${{ steps.disc.outputs.sims }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Discover (§6.1 qualifying Stack-B web sims)
        id: disc
        run: |
          uv run python tools/productization/web-deploy/pipeline.py discover --json > sims.json
          cat sims.json
          NAMES=$(uv run python -c "import json; print(json.dumps([s['name'] for s in json.load(open('sims.json'))]))")
          echo "sims=$NAMES" >> "$GITHUB_OUTPUT"

  build-and-validate:
    name: Build and validate (${{ matrix.sim }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sim: ${{ fromJson(needs.discover.outputs.sims) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Set up Node (pinned)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/${{ matrix.sim }}/web/package-lock.json
      - name: Install Mesa lavapipe (software Vulkan for headless browser WebGPU)
        # Chrome's Dawn/WebGPU comes up over Mesa lavapipe (llvmpipe Vulkan) on the
        # runner — the REAL browser WebGPU path (not WebGL). A SECOND independent
        # browser-WebGPU backend vs the local ANGLE-Vulkan gate (probe § 4).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary 2>/dev/null | head -20 || true
      - name: Install pinned Playwright + Chromium
        working-directory: tools/productization/web-deploy/web/headless
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Selective LFS fetch — committed canonical captures (R2 when wired)
        # Mirrors python-strict.yml: R2 when the secrets reach this job (push + same-repo
        # PRs), else GitHub LFS (fork PRs). capture_roundtrip / new_canonical sims read a
        # committed .h5 canonical; the live-reference sims (strange/boids) need none.
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && \
             [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && [ -n "${S3_BUCKET:-}" ]; then
            source tools/lfs/setup-lfs-s3.sh
            echo "lfs fetch route: R2"
          else
            echo "lfs fetch route: GitHub LFS"
          fi
          git lfs pull --include="captures/**" || echo "no LFS captures for this sim"
      - name: Build artifact (Vite production build)
        run: |
          uv run python tools/productization/web-deploy/pipeline.py build \
            --sim "${{ matrix.sim }}" --output "${{ runner.temp }}/artifacts"
      - name: Sync Python env for verify (per-sim workspace member, declared deps only)
        # verify.py imports numpy at module level, the testkit capture/equivalence
        # modules' deps (numpy, h5py, jsonschema) via its tools/testkit sys.path
        # insert, and — for ising/strange/boids — the sim's own reference package.
        # All of that is ALREADY declared in packages/<sim>/pyproject.toml
        # (bit-physics-testkit, bit-physics-diagnostics, h5py, numpy, ...); the
        # workspace ROOT `[project]` declares NO dependencies, so a bare `uv run`
        # resolves an empty venv (the run-27210300628 ModuleNotFoundError: numpy).
        # Workspace member names match the matrix sim names 1:1. No new deps are
        # declared here and none are installed ad hoc.
        run: uv sync --package "${{ matrix.sim }}"
      - name: Validate (headless browser-WebGPU → sim's established gate)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/productization/web-deploy/web/headless/node_modules/playwright/index.js
          # Harness app-READINESS wait only (driver.mjs __bitPhysicsReady), NOT a
          # physics tolerance and NOT the 300s capture wait. The 30s default was
          # calibrated on local RADV; lavapipe software rasterization compiles
          # pipelines far slower (neural-ca/physarum exceeded 30s in run
          # 27210300628). The driver logs measured time-to-ready per run; the
          # measured lavapipe values get declared in the audit after the green run.
          BITPHYSICS_READY_TIMEOUT_MS: "180000"
          # Ratified cross-backend contingency charter (per-sim opt-in; verify.py
          # consults this ONLY for the listed sims — the other 5 keep their
          # established gates untouched). Round 1: bounds UNDECLARED, so these two
          # FAIL-PENDING loudly while emitting measured observables for round-2
          # measured-then-declared. The canonical-backend gates stay authoritative
          # on RADV/wgpu-native.
          BITPHYSICS_BROWSER_OBSERVABLE_FALLBACK: "boids-3d,neural-ca"
        run: |
          uv run --no-sync python tools/productization/web-deploy/pipeline.py validate \
            --artifacts "${{ runner.temp }}/artifacts" --sim "${{ matrix.sim }}" \
            --skip-build --json > results.json
          cat results.json
      - name: Surface results
        if: always()
        run: cat results.json || true
      - name: Upload built bundle
        # always() per ratified charter Q3: failing jobs must still publish their
        # outputs so the cross-backend measurement pass can read them.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-deploy-${{ matrix.sim }}
          path: packages/${{ matrix.sim }}/web/dist
          retention-days: 30
      - name: Upload browser captures (measurement pass — charter Q3)
        # The captures (not the bundle) are what the round-2 measured-then-declared
        # pass reads; published on failure too (FAIL-PENDING jobs carry the data).
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-deploy-captures-${{ matrix.sim }}
          path: ${{ runner.temp }}/artifacts/${{ matrix.sim }}
          retention-days: 30
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages (operator-dispatched; confirm_deploy=true)
    needs: [discover, build-and-validate]
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write       # Pages deploy (§ 4.5)
      id-token: write    # OIDC for deploy-pages
    steps:
      # Go-live (2026-06-10): pins finalized (tag SHAs verified against the
      # actions repos). The site is the static landing page at the root plus
      # one subdir per sim under sims/, copied from the SAME validated-bundle
      # artifacts the matrix above just produced (capture artifacts are
      # downloaded too but never published). Sims build with Vite base "./",
      # so bundles are subdirectory-safe under the project-Pages path.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: false
      - name: Download validated bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: web-deploy-*
          path: bundles
      - name: Assemble site (landing page + one subdir per validated sim)
        run: |
          set -euo pipefail
          mkdir -p site/sims
          # P-7 fix: landing-v2 references ./assets/ (posters, fonts) and
          # ./about.html — copy the pages dir's static surface wholesale so
          # future page assets need no further workflow edits.
          cp tools/productization/web-deploy/web/pages/index.html site/index.html
          cp tools/productization/web-deploy/web/pages/about.html site/about.html
          cp tools/productization/web-deploy/web/pages/splash.html site/splash.html
          cp -r tools/productization/web-deploy/web/pages/assets site/assets
          SIMS=$(python3 -c 'import json; print(" ".join(json.loads("""${{ needs.discover.outputs.sims }}""")))')
          for sim in $SIMS; do
            test -d "bundles/web-deploy-$sim" || { echo "missing validated bundle for $sim" >&2; exit 1; }
            cp -r "bundles/web-deploy-$sim" "site/sims/$sim"
          done
          echo "site contents:"; find site -maxdepth 3 | sort
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
