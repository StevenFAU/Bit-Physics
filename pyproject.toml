[project]
name = "bit-physics"
version = "0.0.0"
description = "GPU-accelerated physics and emergence simulation portfolio."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "tools/testkit",
  "tools/integrity",
  "tools/diagnostics",
  "packages/reaction-diffusion-2d",
  # Phase 1 Stage 2 TDD-bootstrap sims (registered in Stage 3 per
  # convergence-file discipline; resolves banked items B7, B13, B15).
  "packages/strange-attractors",
  "packages/mandelbulb-explorer",
  "packages/boids-3d",
  "packages/physarum",
  "packages/reaction-diffusion-3d",
  "packages/sph-water",
  "packages/eulerian-smoke",
  "packages/lattice-boltzmann-d3q19",
  "packages/mpm-multimaterial",
  # Common module — Stack D / Python (Taichi-backed sims). Registered
  # at sub-phase-taichi-integration per D2 row 2 ratification.
  "common/common-py",
  # Spec-Phase-2 Stack-D port of reaction-diffusion-2d. Sibling
  # workspace member per D6 ratification at sub-phase-reaction-
  # diffusion-2d-stack-d plan-drafting close; consumes common-py +
  # taichi for the Taichi-DSL Gray-Scott implementation.
  "packages/reaction-diffusion-2d-stack-d",
  # Spec-Phase-2 Stack-D port of sph-water (SECOND per-sim cross-stack
  # port). Sibling workspace member per D1/D6 ratification at sub-phase-
  # sph-water-stack-d plan-drafting close; consumes common-py + taichi
  # for the Taichi-DSL DFSPH implementation. Registered at Stage 1a.
  "packages/sph-water-stack-d",
  # Spec-Phase-2 Stack-D port of lattice-boltzmann-d3q19 (THIRD per-sim
  # cross-stack port). Sibling workspace member per D1/D6 ratification at
  # sub-phase-lattice-boltzmann-d3q19-stack-d plan-drafting close; consumes
  # common-py + taichi for the Taichi-DSL D3Q19 BGK implementation.
  # Registered at Stage 1a.
  "packages/lattice-boltzmann-d3q19-stack-d",
  # Spec-Phase-2 Stack-D port of mpm-multimaterial (FOURTH per-sim cross-stack
  # port). Sibling workspace member per D1/D6 ratification at sub-phase-
  # mpm-multimaterial-stack-d plan-drafting close; consumes common-py + taichi
  # for the Taichi-DSL MLS-MPM/APIC neo-Hookean single-material implementation.
  # First port to exercise the P2G atomic-scatter surface (IC-15 deferred
  # aspect #3) on the Stack-D side. Registered at Stage 1a.
  "packages/mpm-multimaterial-stack-d",
  # Spec-Phase-2 Stack-D port of eulerian-smoke (FIFTH per-sim cross-stack
  # port). Sibling workspace member per D1/D6 ratification at sub-phase-
  # eulerian-smoke-stack-d plan-drafting close; consumes common-py + taichi
  # for the Taichi-DSL Stam-Fedkiw stable-fluids implementation (collocated
  # cell-centered periodic; plain trilinear SL 3D + MacCormack 2D; fixed-cap
  # Jacobi pressure-projection FP-accumulation, the first port to put deferred
  # IC-15 aspect #5 [iterative-solver] in play in its determinism-safe
  # fixed-iteration-count form). Registered at Stage 1.
  "packages/eulerian-smoke-stack-d",
  # Common module — Stack E / Python (NVIDIA Warp-backed sims). The 20th
  # workspace member; first Stack-E entrant. Registered at
  # sub-phase-common-warp-bootstrap Stage 1a per D14 ratification; sister to
  # common/common-py (Stack D / Taichi). Establishes the Stack-E workspace
  # surface (Runtime + Determinism + warp_harness W-2 mechanism at 1a;
  # Capture/Particles/Grids/HashGrid at 1b; hello smoke sim at 1c) that the
  # spec § 11.3 Stack-E ports (MPM 2.3 / Smoke 2.4 / LBM 2.5) consume.
  "common/common-warp",
]
exclude = []

# Lint / type-check / test configuration is per-workspace-member.
# This file is the workspace root only; it deliberately ships no source.
