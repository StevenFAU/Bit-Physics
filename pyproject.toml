[project]
name = "bit-physics"
version = "0.0.0"
description = "GPU-accelerated physics and emergence simulation portfolio."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "tools/testkit",
  "tools/integrity",
  "tools/diagnostics",
  "packages/reaction-diffusion-2d",
  # Phase 1 Stage 2 TDD-bootstrap sims (registered in Stage 3 per
  # convergence-file discipline; resolves banked items B7, B13, B15).
  "packages/strange-attractors",
  "packages/mandelbulb-explorer",
  "packages/boids-3d",
  "packages/physarum",
  "packages/reaction-diffusion-3d",
  "packages/sph-water",
  "packages/eulerian-smoke",
  "packages/lattice-boltzmann-d3q19",
  "packages/mpm-multimaterial",
]
exclude = []

# Lint / type-check / test configuration is per-workspace-member.
# This file is the workspace root only; it deliberately ships no source.
