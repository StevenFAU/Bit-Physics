[project]
name = "bit-physics"
version = "0.0.0"
description = "GPU-accelerated physics and emergence simulation portfolio."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "tools/testkit",
  "tools/integrity",
  "tools/diagnostics",
  "packages/reaction-diffusion-2d",
  # Phase 1 Stage 2 TDD-bootstrap sims (registered in Stage 3 per
  # convergence-file discipline; resolves banked items B7, B13, B15).
  "packages/strange-attractors",
  "packages/mandelbulb-explorer",
  # Phase-6 verification-demo: Stack-B boids-2d web lab. The simulation kernel is
  # browser-native, but the workspace member declares the verifier/testkit deps
  # consumed by web-deploy's per-sim `uv sync --package boids-2d` contract.
  "packages/boids-2d",
  "packages/boids-3d",
  "packages/physarum",
  "packages/reaction-diffusion-3d",
  "packages/sph-water",
  "packages/eulerian-smoke",
  "packages/lattice-boltzmann-d3q19",
  "packages/mpm-multimaterial",
  # Phase-6 Lane-C sim #1 (full posture): APIC/PIC/FLIP free-surface
  # particle fluid. Registered at backend Stage-1a per spec-ref § 11.
  "packages/pic-flip",
  # Phase-6: Incompressible Schrödinger Flow (Chern et al. 2016) f64
  # reference — volumetric-grid family root. Registered at backend
  # execution per docs/sim-specs/volumetric-grid/schrodinger-smoke/
  # spec-ref.md § 11.
  "packages/schrodinger-smoke",
  # Phase-6: 2D heat equation (FTCS + machine-exact spectral/ETD1) f64
  # reference — volumetric-grid family. Registered at backend execution
  # per docs/sim-specs/volumetric-grid/heat-equation/spec-ref.md § 11.
  "packages/heat-equation",
  # Phase-6: signal-workbench (verified DSP instrument: windows/FM-Bessel/
  # biquad/comms/metrology) f64 reference — NEW signal-processing family
  # (spec section 13.2 operator decision 1). Registered at backend
  # execution per docs/sim-specs/signal-processing/signal-workbench/
  # spec-ref.md § 11.
  "packages/signal-workbench",
  # Phase-6: curl-noise (Bridson 2007 + divergence-free-noise frontier)
  # f64 reference — closed-form category, structural sibling of
  # strange-attractors. Registered at backend execution per
  # docs/sim-specs/closed-form/curl-noise/spec-ref.md § 11.
  "packages/curl-noise",
  # Common module — Stack D / Python (Taichi-backed sims). Registered
  # at sub-phase-taichi-integration per D2 row 2 ratification.
  "common/common-py",
  # Spec-Phase-2 Stack-D port of reaction-diffusion-2d. Sibling
  # workspace member per D6 ratification at sub-phase-reaction-
  # diffusion-2d-stack-d plan-drafting close; consumes common-py +
  # taichi for the Taichi-DSL Gray-Scott implementation.
  "packages/reaction-diffusion-2d-stack-d",
  # Spec-Phase-2 Stack-D port of sph-water (SECOND per-sim cross-stack
  # port). Sibling workspace member per D1/D6 ratification at sub-phase-
  # sph-water-stack-d plan-drafting close; consumes common-py + taichi
  # for the Taichi-DSL DFSPH implementation. Registered at Stage 1a.
  "packages/sph-water-stack-d",
  # Phase-6 C-1 unit U-1 differentiable variant of sph-water (Stack D / Taichi
  # ti.ad.Tape; spec § 11.5 item 4.2, Phase-4 ledger row 10 deferred-with-cause).
  # Tape-differentiable free-fall + cubic-spline-density forward on the WU-A
  # autodiff substrate; v0z control + kernel-width-ID inverse problems +
  # gradient golden table (≥3 independent anchors: A1 free-fall closed form /
  # A2 central FD / A3 kernel-width analytic). Single-stack (gate-14 N/A; WU-F
  # differentiable-axis variant-equivalence applies). D-LAYOUT: flat
  # `packages/sph-water-diff/` per §0.3. Registered at C-1 U-1 stage 1a.
  "packages/sph-water-diff",
  # Spec-Phase-2 Stack-D port of lattice-boltzmann-d3q19 (THIRD per-sim
  # cross-stack port). Sibling workspace member per D1/D6 ratification at
  # sub-phase-lattice-boltzmann-d3q19-stack-d plan-drafting close; consumes
  # common-py + taichi for the Taichi-DSL D3Q19 BGK implementation.
  # Registered at Stage 1a.
  "packages/lattice-boltzmann-d3q19-stack-d",
  # Spec-Phase-2 Stack-D port of mpm-multimaterial (FOURTH per-sim cross-stack
  # port). Sibling workspace member per D1/D6 ratification at sub-phase-
  # mpm-multimaterial-stack-d plan-drafting close; consumes common-py + taichi
  # for the Taichi-DSL MLS-MPM/APIC neo-Hookean single-material implementation.
  # First port to exercise the P2G atomic-scatter surface (IC-15 deferred
  # aspect #3) on the Stack-D side. Registered at Stage 1a.
  "packages/mpm-multimaterial-stack-d",
  # Spec-Phase-2 Stack-D port of eulerian-smoke (FIFTH per-sim cross-stack
  # port). Sibling workspace member per D1/D6 ratification at sub-phase-
  # eulerian-smoke-stack-d plan-drafting close; consumes common-py + taichi
  # for the Taichi-DSL Stam-Fedkiw stable-fluids implementation (collocated
  # cell-centered periodic; plain trilinear SL 3D + MacCormack 2D; fixed-cap
  # Jacobi pressure-projection FP-accumulation, the first port to put deferred
  # IC-15 aspect #5 [iterative-solver] in play in its determinism-safe
  # fixed-iteration-count form). Registered at Stage 1.
  "packages/eulerian-smoke-stack-d",
  # Common module — Stack E / Python (NVIDIA Warp-backed sims). The 20th
  # workspace member; first Stack-E entrant. Registered at
  # sub-phase-common-warp-bootstrap Stage 1a per D14 ratification; sister to
  # common/common-py (Stack D / Taichi). Establishes the Stack-E workspace
  # surface (Runtime + Determinism + warp_harness W-2 mechanism at 1a;
  # Capture/Particles/Grids/HashGrid at 1b; hello smoke sim at 1c) that the
  # spec § 11.3 Stack-E ports (MPM 2.3 / Smoke 2.4 / LBM 2.5) consume.
  "common/common-warp",
  # Spec-Phase-2 Stack-E port of mpm-multimaterial (SIXTH per-sim cross-stack
  # port; FIRST Stack-E port; spec § 11.3 item 2.3). The 21st workspace member;
  # FIRST common-warp consumer. NVIDIA Warp @wp.kernel MLS-MPM/APIC neo-Hookean
  # single-material against the Phase-1-frozen NumPy+numba reference; cross-stack
  # content-equivalent at relative = 1e-4 (mpm category, override REUSED per D7).
  # Consumes the common-warp §1.9.1 socket only (Runtime + Capture + Determinism
  # per D10); own wp.array(dtype=wp.float64) per D15. Registered at Stage 1a.
  "packages/mpm-multimaterial-stack-e",
  # Spec-Phase-2 Stack-E port of eulerian-smoke (SEVENTH per-sim cross-stack
  # port; SECOND Stack-E port; spec § 11.3 item 2.4 Stack-E half). The 22nd
  # workspace member; SECOND common-warp consumer. NVIDIA Warp @wp.kernel
  # Stam-Fedkiw stable-fluids (collocated cell-centered periodic; trilinear SL
  # 3D + MacCormack 2D; fixed-cap Jacobi pressure-projection) against the
  # Phase-1-frozen NumPy reference; cross-stack content-equivalent at
  # relative = 1e-4 (smoke category, override REUSED per D6) -- the SECOND R-P2
  # chaotic-regime instance (gate-14 within_tolerance=False is the CORRECT
  # verdict; D10). Consumes the common-warp §1.9.1 socket only (Runtime +
  # Capture + Determinism per D7); own wp.array(dtype=wp.float64) per D15.
  # Registered at Stage 1b (the failing-tests scaffold landed at Stage 1a).
  "packages/eulerian-smoke-stack-e",
  # EIGHTH per-sim cross-stack port; THIRD Stack-E port; SECOND LBM port. D3Q19
  # BGK lattice-Boltzmann (Qian-1992 equilibrium + Guo-2002 forcing); NVIDIA Warp
  # CPU. Cross-stack content-equivalent at relative = 1e-5 (lbm category, the
  # portfolio-tightest) -- a cross-stack BIT-EXACT witness (within_tolerance=True,
  # max_abs_err=0.0; shape (a), the FIRST on a laminar trajectory; D10). Consumes
  # the common-warp §1.9.1 socket only (Runtime + Capture + Determinism per D7);
  # own wp.array(dtype=wp.float64, ndim=4) per D8/D15. Registered at Stage 1b (the
  # failing-tests scaffold landed at Stage 1a).
  "packages/lattice-boltzmann-d3q19-stack-e",
  # Common module — Stack E / Python (NVIDIA Warp-backed) 3D-Gaussian-Splatting
  # surface (spec § 11.4 item 3.8). The 23rd workspace member; SECOND common-*
  # Stack-E module (sister to common/common-warp). Introduced by Phase-3 task-1
  # (sub-phase-phase-3-common-3dgs); produces the GaussianSplatModel / render /
  # Camera API that task-8 (3dgs-mpm) + Phase-4 WU-C consume unchanged. Vendors the
  # Inria gaussian-splatting reference (NON-COMMERCIAL research license) under
  # references/3DGS-reference/. Registered at Stage 1a.
  "common/common-3dgs",
  # Phase-3 task-3 (sub-phase-phase-3-lenia). FIRST SIM in Phase 3 (after the
  # two infrastructure roots common-3dgs at task-1 and render-similarity at
  # task-2). The 24th workspace member; Stack-D Taichi-backed reference Lenia
  # (Chan 2019; Chakazul/Lenia vendored at SHA adfc54... MIT). §0.3
  # SHIFT-from-discovered: plan §6.3 prescribes `continuous-ca/lenia/python/`
  # at repo root; on-disk convention at HEAD is `packages/<name>/`. Charter +
  # plan-drafting audit document SHIFTED-surface-only (NO plan edit).
  # Registered at Stage 1a.
  "packages/lenia",
  # Phase-3 task-3a (sub-phase-phase-3-ising-classical). FOURTH Phase-3
  # sub-phase + FIRST Stack-B SIM in Phase 3. The 25th workspace member;
  # reference 2D Ising-classical (Metropolis-Hastings checkerboard Monte
  # Carlo; NumPy reference oracle + local-only WGSL parallel-Metropolis).
  # §0.3 SHIFT-from-discovered: §6.3a literal
  # `lattice-spin/ising-classical/typescript/` superseded by the
  # existing-convention `packages/<name>/` precedent (D-LAYOUT, mirrors
  # lenia). Registered at Stage 1a.
  "packages/ising-classical",
  # Phase-3 task-4 (sub-phase-phase-3-rigid-body). FIFTH Phase-3 sub-phase +
  # FIRST Stack-E SIM in Phase 3 (after the Phase-2 common-warp Stack-E ports).
  # The 26th workspace member; reference articulated rigid-body pendulum
  # (Featherstone ABA reduced-coordinate forward dynamics; planar revolute
  # serial chain; semi-implicit Euler + RK4). Consumes the common-warp §1.9.1
  # socket only (Runtime + Capture + Determinism); own wp.array(dtype=
  # wp.float64). D-LAYOUT: flat `packages/articulated-pedagogical/` per §0.3
  # (NOT the plan's top-level `rigid-body/`). D-ALGO: ABA, not §5.8's
  # "maximal-coordinate" (corrigendum A-1 in docs/spec-amendments-proposed.md).
  # Registered at Stage 1a.
  "packages/articulated-pedagogical",

  # Phase-3 task-6 (sub-phase-phase-3-neural-ca). SIXTH Phase-3 sub-phase +
  # FIRST dual-stack SIM of Phase 3 (Stack D PyTorch training+inference +
  # Stack B custom-WGSL inference at packages/neural-ca/typescript/, tied by
  # ONE trained checkpoint) + FIRST cross-stack gate-14 (render-similarity,
  # statistical) + FIRST learned-dynamics sim. The 27th workspace member; the
  # Python (Stack-D) half lives at packages/neural-ca/python/ (D-LAYOUT:
  # unified packages/neural-ca/{python,typescript}/ per the charter; the TS
  # half is a local-only deploy deliverable, not a workspace member, mirroring
  # ising's src/*.{ts,wgsl}). Reimplements the NCA update rule from Mordvintsev
  # et al. 2020 (Distill); vendored oracle references/growing-neural-ca/.
  # Registered at Stage 1a.
  "packages/neural-ca/python",
  # Phase-6 C-1 unit U-2 frozen-gate Differentiable Logic CA variant of neural-ca
  # (Stack D / Taichi; spec § 11.5 item 4.20, Phase-4 ledger row 28 deferred-with-
  # cause; ratified D-3 frozen-gate scope). Hand-constructed 16-gate multilinear
  # circuit computing exact Game-of-Life in the hard limit (exhaustive-512 golden)
  # + WU-A soft-excitation gradient surface (no training, no EFECT). Golden table
  # ≥3 anchors (A1 gate truth tables+midpoints / A2 exhaustive-512 GoL / A3
  # central FD). Single-stack (gate-14 N/A; parent-equivalence REFRAMED to exact
  # circuit goldens). D-LAYOUT: flat `packages/neural-ca-frontier-difflogic/` per
  # §0.3. Registered at C-1 U-2 stage 1a.
  "packages/neural-ca-frontier-difflogic",

  # Phase-3 task-7 (sub-phase-phase-3-pinn-poisson). SEVENTH Phase-3 sub-phase +
  # FIRST learned-dynamics-CATEGORY sim. Stack E (Warp substrate) + PyTorch,
  # CPU-only. Soft-constraint Raissi-2019 PINN solving the 2D Poisson equation
  # Du=f on the unit square; verified two-pronged vs analytic anchors (>=3
  # independent references incl. one inhomogeneous f!=0 MMS case) AND a reusable
  # classical FD reference (tools/testkit/code_verification/classical-references/
  # poisson-2d-fd/), plus convergence-with-collocation. D-LAYOUT: flat
  # `packages/pinn-poisson/` per §0.3 (lenia/articulated-pedagogical precedent).
  # Reimplements the PINN from Raissi et al. 2019 (J. Comput. Phys. 378:686-707);
  # read-only oracle references/PhysicsNeMo-PINN/. Registered at Stage 1a.
  "packages/pinn-poisson",

  # Phase-3 task-8 (sub-phase-phase-3-3dgs-mpm). The Phase-3 FINALE + FIRST
  # neural-rendered-CATEGORY sim. Single-stack Stack E (Warp + Python), CPU-only.
  # PhysGaussian-style MPM->3DGS coupling: CONSUMES the Phase-2 MPM solver
  # (packages/mpm-multimaterial-stack-e) + the common-3dgs renderer; the NOVEL work
  # is the sim-local coupling (per-frame: MPM step -> per-particle deformation
  # gradient F -> Gaussian covariance Sigma'=F A F^T (PhysGaussian Eq. (8)) ->
  # scale/rotation; SH frozen for MVP). Verified two-pronged: numerical coupling
  # golden (>=3 anchors) + perceptual render-similarity vs OWN committed renders
  # (deterministic own-pipeline regression; MUST clear the §2.12 floors). D-LAYOUT:
  # flat `packages/3dgs-mpm/` per §0.3; the import package is `gs_mpm` (the dir is
  # digit-leading; PEP 8 forbids a leading-digit module). PhysGaussian is CITE-ONLY
  # (no upstream LICENSE); coupling reimplemented from the paper equations.
  # Registered at Stage 1a.
  "packages/3dgs-mpm",

  # Phase-4 batch-1 sim 1/4 (CPU-side differentiable frontier). Differentiable
  # variant of reaction-diffusion-2d-stack-d: a tape-differentiable (ti.ad.Tape)
  # Gray-Scott forward on the WU-A autodiff substrate (common_py.autodiff), with
  # inverse-problem parameter recovery + a gradient golden table (>=3 independent
  # anchors: discrete-Fourier-eigenmode analytic / central-FD baseline / reaction-
  # ODE-limit analytic). Closes the 4.1 §1.D `reaction_diffusion_2d_mms` mutation-
  # coverage gap. Single-stack (gate-14 N/A; WU-F differentiable-axis variant-
  # equivalence applies). D-LAYOUT: flat `packages/reaction-diffusion-2d-diff/`
  # per §0.3. Registered at Stage 1a.
  "packages/reaction-diffusion-2d-diff",
  # Spec-Phase-4 batch-1 differentiable variant of lenia (sim 2/4; Stack D / Taichi
  # ti.ad.Tape). Tape-differentiable Quad4-Lenia forward on the WU-A autodiff substrate;
  # growth-parameter (μ,σ) + initial-field inverse problems + gradient golden table with
  # ≥3 independent anchors (A1 Quad4 growth-deriv / A2 central FD / A3 convolution-Jacobian
  # field gradient). Single-stack (gate-14 N/A; WU-F differentiable-axis equivalence
  # applies). D-LAYOUT: flat `packages/lenia-diff/` per §0.3. Registered at Stage 1a.
  "packages/lenia-diff",
  # Spec-Phase-4 batch-1 differentiable variant of mpm-multimaterial (sim 3/4; Stack D /
  # Taichi ti.ad.Tape). Tape-differentiable 3D APIC neo-Hookean MLS-MPM forward on the WU-A
  # autodiff substrate; initial-velocity inverse problem (DiffTaichi throw-to-target) +
  # gradient golden table with ≥3 independent anchors (A1 ballistic kinematic / A2 central FD
  # / A3 neo-Hookean small-strain constitutive). Single-stack (gate-14 N/A; WU-F
  # differentiable-axis equivalence applies). D-LAYOUT: flat `packages/mpm-multimaterial-diff/`
  # per §0.3. Registered at Stage 1a.
  "packages/mpm-multimaterial-diff",
  # Spec-Phase-4 batch-1 differentiable variant of eulerian-smoke (sim 4/4; FINAL; Stack E /
  # NVIDIA Warp wp.Tape — the FIRST Stack-E consumer of WU-A). Tape-differentiable
  # semi-Lagrangian smoke step (SL backtrace + bilinear gather + explicit diffusion) on the WU-A
  # autodiff substrate (common_warp.autodiff); initial-smoke-field inverse problem + gradient
  # golden table with ≥3 independent anchors (A1 linear-advection-operator analytic / A2 central
  # FD / A3 discrete-diffusion ∂Loss/∂ν analytic). Single-stack (gate-14 N/A; WU-F
  # differentiable-axis equivalence applies). D-LAYOUT: flat `packages/eulerian-smoke-diff/`
  # per §0.3. Registered at Stage 1a.
  "packages/eulerian-smoke-diff",

  # Phase-4 batch-2 Sim A (neural-rendered frontier). The SH-update deferred from
  # Phase-3 task-8: per-frame spherical-harmonic rotation under the MPM deformation's
  # rotation part (polar decomposition F=R S; PhysGaussian Eq. (9)). SIBLING package —
  # does NOT mutate the frozen packages/3dgs-mpm/ MVP; reuses gs_mpm.couple_gaussians
  # (covariance, UNCHANGED) + the MPM kernels by import, and ADDS the degree-1 Wigner-D
  # SH rotation D1(R)=P R P^T (P from the landed common-3dgs real-SH basis). A NEW
  # degree-1 directional-SH scene (the landed scene is degree-0/DC-only -> rotation is a
  # no-op). Two-pronged: SH-rotation numerical golden (>=3 anchors: A1 P R P^T closed
  # form / A2 rotation-equivariance vs the renderer / A3 pure-stretch frozen) + perceptual
  # render-similarity vs OWN committed renders. Single-stack (gate-14 N/A; WU-F neural-axis
  # floor applies). Import package `gs_mpm_sh_update` (digit-leading dir). Registered at
  # Stage 1a.
  "packages/3dgs-mpm-sh-update",

  # Phase-4 batch-2 Sim B (neural-rendered frontier; spec § 5.11 "3dgs-smoke"). Couples the
  # landed eulerian-smoke-stack-e volumetric smoke (Stam/Fedkiw stable fluids; the 3D density
  # field) to a Gaussian cloud via the WU-C density->opacity Beer-Lambert hook
  # (common_3dgs.default_density_to_opacity) and renders it. Two-pronged: coupling-correctness
  # numerical golden (>=3 anchors: A1 Beer-Lambert 1-exp(-d) / A2 Kerbl Eq.6 alpha-compositing /
  # A3 zero-density background) + perceptual render-similarity vs OWN committed renders. Reuses
  # stable_fluids_step_3d by import (physics-equivalence-vs-parent holds by construction). Small
  # grid for CPU-tractable render. Single-stack (gate-14 N/A; WU-C neural-axis floor). Import
  # package `eulerian_smoke_neural`. Registered at Stage 1a.
  "packages/eulerian-smoke-neural",

  # Phase-4 batch-3 sim 1/3 (frontier-algorithm batch; the differentiable carry). The
  # differentiable sibling of the Phase-3 task-4 Featherstone ABA (Stack E / NVIDIA Warp
  # wp.Tape): the landed parent aba_kernel is launched on-device inside a wp.Tape (no .numpy()
  # tape-sever) so the single-pendulum gradient is machine-exact (Stage-0 WARP-NATIVE-TAPE
  # probe: d q_ddot/d q == -(g/L)cos q to 1.9e-16; the n>=2 coupled adjoint is deferred).
  # Gradient golden table (>=3 independent anchors: A1 d q_ddot/d q analytic / A2 central FD /
  # A3 d q_ddot/d tau = 1/(mL^2) analytic) + initial-state-recovery inverse problem +
  # gradient_fields capture. Single-stack (gate-14 N/A; WU-F differentiable-axis
  # forward-equivalence to the landed parent). Depends on the parent workspace package.
  # D-LAYOUT: flat `packages/articulated-pedagogical-diff/` per §0.3. Registered at Stage 1a.
  "packages/articulated-pedagogical-diff",

  # Phase-4 batch-3 sim 2/3 (frontier-algorithm batch). Energy-based Particle Lenia (Stack D /
  # Taichi; Mordvintsev/Niklasson/Randazzo 2022, Google Research Self-Organising Systems): particles
  # descend their OWN local energy field E(x)=R(x)-G(U(x)) (the canonical LOCAL rule
  # dp_i/dt=-grad E(p_i); total energy NOT monotonic). Taichi analytic-force engine; gradient golden
  # >=3 independent anchors (A1 analytic -grad E NumPy mirror / A2 central FD / A3 total-energy
  # translation symmetry). Energy monotonicity NOT asserted (unsound for the LOCAL rule). Single-stack
  # (gate-14 N/A; parent-vs-frontier REFRAMED to invariant posture — particle-based, not
  # pointwise-comparable to grid Lenia). D-LAYOUT: flat `packages/particle-lenia/` per §0.3.
  # Registered at Stage 1a.
  "packages/particle-lenia",

  # Phase-4 batch-3 sim 3/3 (frontier-algorithm batch; FINAL). Mass-conservative Flow Lenia (Stack D
  # / Taichi; Plantec et al. ALIFE 2022, arXiv:2212.07906): matter transported by reintegration
  # tracking so total mass Sigma A is conserved by construction (to summation roundoff ~N*eps, NOT
  # bit-exact). Taichi convolve->flow->reintegration-scatter engine; golden >=3 independent anchors
  # (A1 mass conservation honest summation tolerance / A2 non-negativity / A3 zero-flow identity).
  # The SOUND home of the Phase-3 plain-Lenia mass_approximately_conserved invariant FALSIFIED under
  # Quad4 (re-routed, not widened). Single-stack (gate-14 N/A; parent-vs-frontier REFRAMED to
  # invariant posture). D-LAYOUT: flat `packages/flow-lenia/` per §0.3. Registered at Stage 1a.
  "packages/flow-lenia",
]
exclude = []

# Lint / type-check / test configuration is per-workspace-member.
# This file is the workspace root only; it deliberately ships no source.
