[project]
name = "pic-flip"
version = "0.0.0"
description = "Particle-fluids sub-phase — pic-flip sim (APIC Jiang 2015 collocated, PIC/FLIP comparison modes; NumPy reference, Phase-6 Lane-C full posture)."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "h5py>=3.10",
  "hypothesis>=6.0",
  "numba>=0.60",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pic_flip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
