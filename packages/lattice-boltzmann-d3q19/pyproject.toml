[project]
name = "lattice-boltzmann-d3q19"
version = "0.0.0"
description = "Phase 1 Stage 2 — D3Q19 BGK lattice-Boltzmann sim (TDD bootstrap)."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lattice_boltzmann_d3q19"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
