[project]
name = "articulated-pedagogical"
version = "0.0.0"
description = "Phase 3 task-4 — reference articulated rigid-body pendulum sim on Stack E (Python / NVIDIA Warp). Featherstone Articulated-Body Algorithm (ABA, reduced/generalized-coordinate, Ch. 7 §7.2-§7.3) forward dynamics for a planar revolute serial chain; semi-implicit (symplectic) Euler default + RK4 option. Analytic single-pendulum golden anchors (small-angle T=2pi*sqrt(L/g); large-angle exact T=4*sqrt(L/g)*K(sin(theta0/2)); Jacobi-cn trajectory) + RK4-reference numerical baselines for double-pendulum / 6-DOF chain. bit-exact same-stack-same-hw."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "bit-physics-diagnostics",
  "bit-physics-common-warp",
  "h5py>=3.10",
  "hypothesis>=6.0",
  "numpy>=2.0",
  # Complete elliptic integral K(k) (scipy.special.ellipk) + Jacobi elliptic
  # functions sn/cn/dn (scipy.special.ellipj) for the analytic single-pendulum
  # golden anchors (large-angle exact period + closed-form trajectory). These
  # are host-side, stack-agnostic reference oracles (NOT in the Warp hot loop).
  "scipy>=1.13",
  # Stack-E NVIDIA Warp runtime, consumed transitively via common-warp but
  # listed for the direct `import warp` in the ABA kernel module. Pin mirrors
  # common/common-warp (warp-lang>=1.13,<2.0; conventions doc § H.4 re-pin policy).
  "warp-lang>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["articulated_pedagogical"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["articulated_pedagogical"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "capture", "capture.*",
  "common_warp", "common_warp.*",
  "determinism", "determinism.*",
  "diagnostics", "diagnostics.*",
  "property", "property.*",
  "h5py", "h5py.*",
  "hypothesis", "hypothesis.*",
  "scipy", "scipy.*",
  "warp", "warp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
  # Strict-warnings posture mirroring mpm-multimaterial-stack-e: Warp 1.13.0
  # emits no Python Warning reaching pytest's gate under -W error (the only
  # Warp warning, a PCH-tempdir ResourceWarning, fires in the interpreter-
  # shutdown finalizer after the session ends).
  "error",
]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }
bit-physics-common-warp = { workspace = true }
