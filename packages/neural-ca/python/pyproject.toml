[project]
name = "neural-ca"
version = "0.0.0"
description = "Phase 3 task-6 — Growing Neural Cellular Automata reference sim. FIRST dual-stack SIM of Phase 3: Stack D (PyTorch training + inference) + Stack B (custom-WGSL inference, ../typescript/) tied by ONE checkpoint; FIRST cross-stack gate-14 (render-similarity, statistical). Update rule reimplemented from Mordvintsev et al. 2020 (Distill)."
readme = "README.md"
license = { file = "../../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit[render-similarity]",
  "bit-physics-diagnostics",
  "bit-physics-common-py",
  "h5py>=3.10",
  "hypothesis>=6.0",
  "numpy>=2.0",
  "torch>=2.2",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
# Local-only (spec § 7.8): the wgpu-py WebGPU binding drives the Stack-B WGSL
# forward inference on a GPU host to GENERATE the committed B-inference capture.
# CI never installs this — it reads the committed capture and uses the NumPy
# oracle (neural_ca.reference). The environment here has no Node WebGPU runtime
# (only @webgpu/types, no deno), so the committed WGSL is executed via wgpu-py
# (wgpu-native / Vulkan); the ../typescript/ driver is the Phase-5 deploy path.
local-gpu = [
  "wgpu>=0.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neural_ca"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["neural_ca"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "capture", "capture.*",
  "common_py", "common_py.*",
  "determinism", "determinism.*",
  "diagnostics", "diagnostics.*",
  "property", "property.*",
  "render_similarity", "render_similarity.*",
  "h5py", "h5py.*",
  "hypothesis", "hypothesis.*",
  "torch", "torch.*",
  "safetensors", "safetensors.*",
  "wgpu", "wgpu.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
  "error",
]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }
bit-physics-common-py = { workspace = true }
