[project]
name = "curl-noise"
version = "0.0.0"
description = "Phase 6 — curl-noise (Bridson 2007 + divergence-free-noise frontier) f64 reference; closed-form category."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "bit-physics-diagnostics",
  "h5py>=3.10",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["hypothesis>=6.0", "pytest>=8.0"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curl_noise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
