[project]
name = "terrain-erosion"
version = "0.0.1"
description = "Canyon Lab: conservative shallow-water hydraulics and layered terrain erosion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["bit-physics-testkit", "bit-physics-diagnostics", "numpy>=2.0", "h5py>=3.10", "hypothesis>=6.0"]
[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["terrain_erosion"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }
