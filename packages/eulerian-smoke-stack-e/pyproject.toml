[project]
name = "eulerian-smoke-stack-e"
version = "0.0.0"
description = "Spec-Phase-2 Stack-E port of eulerian-smoke (Stam-Fedkiw stable-fluids; collocated cell-centered periodic; plain trilinear SL 3D + MacCormack 2D; fixed-cap Jacobi pressure-projection FP-accumulation, IC-15 aspect #5 determinism-safe form; vorticity confinement present-but-not-exercised). NVIDIA Warp @wp.kernel CPU implementation against the Phase-1-frozen NumPy reference (stack.name='numpy-reference'); cross-stack content-equivalent at relative = 1e-4 per spec 2.6 (smoke tolerance category) -- the SECOND R-P2 chaotic-regime instance (within_tolerance=False is the CORRECT verdict; D10). SEVENTH per-sim cross-stack port; SECOND Stack-E port consuming common-warp (socket-only: Runtime + Capture + Determinism per D7; own wp.array(dtype=wp.float64) per D15)."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "bit-physics-diagnostics",
  "bit-physics-common-warp",
  "h5py>=3.10",
  "hypothesis>=6.0",
  "numpy>=2.0",
  # Stack-E NVIDIA Warp runtime, consumed transitively via common-warp but
  # listed for the direct `import warp` in reference/stable_fluids_warp.py. Pin
  # mirrors common/common-warp (warp-lang>=1.13,<2.0; conventions doc § H.4
  # re-pin policy).
  "warp-lang>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eulerian_smoke_stack_e"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["eulerian_smoke_stack_e"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "capture", "capture.*",
  "code_verification", "code_verification.*",
  "common_warp", "common_warp.*",
  "determinism", "determinism.*",
  "diagnostics", "diagnostics.*",
  "equivalence", "equivalence.*",
  "property", "property.*",
  "h5py", "h5py.*",
  "hypothesis", "hypothesis.*",
  "warp", "warp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
  # Strict-warnings posture. NO Warp-specific bare-form filter is needed:
  # common-warp Stage-0 Task 0.3 + this sub-phase's Stage-0 Task 0.2 verified
  # Warp 1.13.0 emits no Python Warning that reaches pytest's gate under
  # -W error. Contrast the Taichi Stack-D ports, which need
  # `ignore::DeprecationWarning:taichi.*`.
  "error",
]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }
bit-physics-common-warp = { workspace = true }
