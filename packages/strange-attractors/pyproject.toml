[project]
name = "strange-attractors"
version = "0.0.0"
description = "Phase 1 Stage 2 — closed-form strange-attractors sim (TDD bootstrap; implementation deferred to Phase 2+)."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"

# Phase 1 Stage 2 ships only the failing test suite. Phase 2+ implementation
# will add concrete deps (numpy, h5py, hypothesis) — left unpinned here so
# the bootstrap pyproject is install-light. Run tests via PYTHONPATH per
# README.md.

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strange_attractors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
