[project]
name = "lenia"
version = "0.0.0"
description = "Phase 3 task-3 — reference Lenia continuous CA on Stack D (Taichi). Quad4 kernel + Orbium unicaudatus preset; real-space Taichi-kernel convolution; bit-exact same-stack-same-hw via Taichi seed."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "bit-physics-diagnostics",
  "bit-physics-common-py",
  "h5py>=3.10",
  "hypothesis>=6.0",
  "numpy>=2.0",
  "taichi>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lenia"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["lenia"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "capture", "capture.*",
  "common_py", "common_py.*",
  "determinism", "determinism.*",
  "diagnostics", "diagnostics.*",
  "property", "property.*",
  "h5py", "h5py.*",
  "hypothesis", "hypothesis.*",
  "taichi", "taichi.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
  "error",
  # Taichi 1.7.4 internally calls `locale.getdefaultlocale()` (Python 3.12
  # deprecates; removal slated for 3.15). Filter the deprecation so the
  # strict-warnings posture is preserved without coupling to Taichi's
  # release cadence (sister convention: packages/reaction-diffusion-2d-stack-d
  # + common/common-py per docs/common/taichi.md § 4.5).
  "ignore::DeprecationWarning:taichi.*",
  # Taichi's cold-`.pyc` compile raises an invalid-escape SyntaxWarning
  # (taichi/tools/image.py); compile-time SyntaxWarnings carry a
  # filename-derived module, so only the bare category form matches.
  "ignore::SyntaxWarning",
  "ignore:.*locale\\.getdefaultlocale.*:DeprecationWarning",
]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }
bit-physics-common-py = { workspace = true }
