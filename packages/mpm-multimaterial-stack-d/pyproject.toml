[project]
name = "mpm-multimaterial-stack-d"
version = "0.0.0"
description = "Spec-Phase-2 Stack-D port of mpm-multimaterial (MLS-MPM, Hu 2018 + APIC 4/dx^2 reconstruction; neo-Hookean single-material). Taichi-DSL CPU implementation against the Phase-1-frozen NumPy+numba reference (stack.name='numpy-numba-reference'); cross-stack content-equivalent at relative = 1e-4 per spec 2.6 (mpm tolerance category). FOURTH per-sim cross-stack port; first to exercise the P2G atomic-scatter surface (IC-15 deferred aspect #3) on the Stack-D side."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "bit-physics-diagnostics",
  "bit-physics-common-py",
  "h5py>=3.10",
  "hypothesis>=6.0",
  "numpy>=2.0",
  "taichi>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mpm_multimaterial_stack_d"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["mpm_multimaterial_stack_d"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "capture", "capture.*",
  "code_verification", "code_verification.*",
  "common_py", "common_py.*",
  "determinism", "determinism.*",
  "diagnostics", "diagnostics.*",
  "equivalence", "equivalence.*",
  "property", "property.*",
  "h5py", "h5py.*",
  "hypothesis", "hypothesis.*",
  "taichi", "taichi.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
  "error",
  # Taichi 1.7.4 internally calls `locale.getdefaultlocale()` during
  # `ti.init()`; Python 3.12 deprecates that API (slated for removal in
  # 3.15). Filter the resulting DeprecationWarning so the strict-warnings
  # posture is preserved without coupling to Taichi-upstream's release
  # cadence (sister convention: `common/common-py/pyproject.toml` per
  # docs/common/taichi.md 4.5; mirrors packages/lattice-boltzmann-d3q19-stack-d).
  "ignore::DeprecationWarning:taichi.*",
  # taichi's cold-`.pyc` compile raises an invalid-escape SyntaxWarning
  # (taichi/tools/image.py); compile-time SyntaxWarnings carry a
  # filename-derived module, so only the bare category form matches.
  "ignore::SyntaxWarning",
  "ignore:.*locale\\.getdefaultlocale.*:DeprecationWarning",
]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }
bit-physics-common-py = { workspace = true }
