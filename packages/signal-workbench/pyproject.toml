[project]
name = "signal-workbench"
version = "0.0.0"
description = "Phase 6 — verified DSP instrument (windows/FM-Bessel/biquad/comms/metrology) f64 reference."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "bit-physics-diagnostics",
  "h5py>=3.10",
  "numpy>=2.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["hypothesis>=6.0", "pytest>=8.0"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signal_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
