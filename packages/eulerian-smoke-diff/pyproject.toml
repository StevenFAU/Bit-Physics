[project]
name = "eulerian-smoke-diff"
version = "0.0.0"
description = "Spec-Phase-4 differentiable variant of eulerian-smoke (sim 4/4; Stack E / NVIDIA Warp wp.Tape). Tape-differentiable semi-Lagrangian smoke step (SL backtrace + bilinear gather + explicit diffusion) on the WU-A autodiff substrate (common_warp.autodiff); initial-smoke-field inverse problem + gradient golden table (≥3 independent anchors: linear-advection-operator analytic / central-FD baseline / discrete-diffusion ∂Loss/∂ν analytic) per the phase-4 batch-1 charter."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "bit-physics-diagnostics",
  "bit-physics-common-warp",
  "h5py>=3.10",
  "hypothesis>=6.0",
  "numpy>=2.0",
  # Stack-E NVIDIA Warp runtime, consumed transitively via common-warp but listed for the
  # direct `import warp` in _kernels.py / sim.py. Pin mirrors common/common-warp
  # (warp-lang>=1.13,<2.0; conventions doc § H.4 re-pin policy).
  "warp-lang>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  # The landed forward-reference sibling; imported by the WU-F forward-equivalence test
  # (diff advect/diffuse == eulerian-smoke-stack-e reference primitives, differentiable axis).
  "eulerian-smoke-stack-e",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eulerian_smoke_diff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["eulerian_smoke_diff"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "capture", "capture.*",
  "common_warp", "common_warp.*",
  "determinism", "determinism.*",
  "diagnostics", "diagnostics.*",
  "equivalence", "equivalence.*",
  "eulerian_smoke_stack_e", "eulerian_smoke_stack_e.*",
  "golden", "golden.*",
  "property", "property.*",
  "h5py", "h5py.*",
  "hypothesis", "hypothesis.*",
  "warp", "warp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
  # Strict-warnings posture. Warp 1.13.0 emits no Python Warning reaching pytest's gate under
  # -W error (eulerian-smoke-stack-e Stack-E precedent — no Warp-specific filter needed; contrast
  # the Taichi Stack-D sibling diff sims which need `ignore::DeprecationWarning:taichi.*`).
  "error",
]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }
bit-physics-common-warp = { workspace = true }
eulerian-smoke-stack-e = { workspace = true }
