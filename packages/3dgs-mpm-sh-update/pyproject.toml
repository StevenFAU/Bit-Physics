[project]
name = "3dgs-mpm-sh-update"
version = "0.0.0"
description = "Phase-4 batch-2 Sim A — the SH-update deferred from Phase-3 task-8 (3dgs-mpm). Per-frame spherical-harmonic rotation under the MPM deformation's rotation part (polar decomposition F=R S; PhysGaussian Eq. (9), arXiv:2311.12198, CITE-ONLY). SIBLING of packages/3dgs-mpm (NOT a mutation): reuses gs_mpm.couple_gaussians (covariance Sigma'=F A F^T, UNCHANGED) + the MPM kernels by import, and ADDS the degree-1 Wigner-D SH rotation D1(R)=P R P^T derived from the landed common-3dgs real-SH basis. A NEW degree-1 directional-SH scene (the landed scene is degree-0/DC-only -> rotation is a no-op). Two-pronged: SH-rotation numerical golden (>=3 anchors) + perceptual render-similarity vs OWN committed renders. Import package `gs_mpm_sh_update` (the dir is digit-leading; PEP 8 forbids a leading-digit module)."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit[render-similarity]",
  "bit-physics-diagnostics",
  "bit-physics-common-warp",
  "bit-physics-common-3dgs",
  "3dgs-mpm",
  "mpm-multimaterial-stack-e",
  "h5py>=3.10",
  "hypothesis>=6.0",
  "numpy>=2.0",
  "warp-lang>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "lpips==0.1.4",
  "torch>=2.2",
  "torchvision>=0.13",
  "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gs_mpm_sh_update"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["gs_mpm_sh_update"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "capture", "capture.*",
  "common_warp", "common_warp.*",
  "common_3dgs", "common_3dgs.*",
  "gs_mpm", "gs_mpm.*",
  "mpm_multimaterial_stack_e", "mpm_multimaterial_stack_e.*",
  "determinism", "determinism.*",
  "diagnostics", "diagnostics.*",
  "property", "property.*",
  "render_similarity", "render_similarity.*",
  "h5py", "h5py.*",
  "hypothesis", "hypothesis.*",
  "warp", "warp.*",
  "lpips", "lpips.*",
  "torch", "torch.*",
  "torchvision", "torchvision.*",
  "PIL", "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
  "error",
]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }
bit-physics-common-warp = { workspace = true }
bit-physics-common-3dgs = { workspace = true }
3dgs-mpm = { workspace = true }
mpm-multimaterial-stack-e = { workspace = true }
