[project]
name = "3dgs-mpm"
version = "0.0.0"
description = "Phase 3 task-8 — FIRST neural-rendered-CATEGORY sim + Phase-3 FINALE. PhysGaussian-style MPM->3DGS coupling on Stack E (Warp + Python), CPU-only. Consumes the Phase-2 MPM solver (packages/mpm-multimaterial-stack-e) + common-3dgs renderer; the NOVEL work is the sim-local coupling (per-frame: MPM step -> per-particle deformation gradient F -> Gaussian covariance Sigma'=F A F^T -> scale/rotation; SH frozen for MVP). Verified two-pronged: numerical coupling-correctness golden (>=3 anchors) + perceptual render-similarity vs OWN committed golden renders (deterministic own-pipeline regression; MUST clear the spec 2.12 floors). Import package is `gs_mpm` (the dir 3dgs-mpm is digit-leading; PEP 8 forbids a leading-digit module)."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "bit-physics-diagnostics",
  "bit-physics-common-warp",
  "bit-physics-common-3dgs",
  "mpm-multimaterial-stack-e",
  "h5py>=3.10",
  "hypothesis>=6.0",
  "numpy>=2.0",
  # Stack-E NVIDIA Warp runtime, consumed via common-warp / common-3dgs / the MPM
  # kernels; pin mirrors common/common-warp (conventions doc § H.4 re-pin policy).
  "warp-lang>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  # render-similarity perceptual metrics (LPIPS) for the golden-render prong tests.
  "lpips==0.1.4",
  "torch>=2.2",
  "torchvision>=0.13",
  "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gs_mpm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["gs_mpm"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "capture", "capture.*",
  "common_warp", "common_warp.*",
  "common_3dgs", "common_3dgs.*",
  "mpm_multimaterial_stack_e", "mpm_multimaterial_stack_e.*",
  "determinism", "determinism.*",
  "diagnostics", "diagnostics.*",
  "property", "property.*",
  "render_similarity", "render_similarity.*",
  "h5py", "h5py.*",
  "hypothesis", "hypothesis.*",
  "warp", "warp.*",
  "lpips", "lpips.*",
  "torch", "torch.*",
  "torchvision", "torchvision.*",
  "PIL", "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
  "error",
]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }
bit-physics-common-warp = { workspace = true }
bit-physics-common-3dgs = { workspace = true }
mpm-multimaterial-stack-e = { workspace = true }
