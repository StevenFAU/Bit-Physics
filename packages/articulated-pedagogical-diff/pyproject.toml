[project]
name = "articulated-pedagogical-diff"
version = "0.0.0"
description = "Phase 4 batch-3 sim 1 — differentiable articulated pendulum (Stack E / NVIDIA Warp wp.Tape). The differentiable sibling of the Phase-3 task-4 Featherstone ABA: tape-differentiable single-pendulum forward dynamics (on-device requires_grad kernels, no .numpy() tape-sever), gradient golden table (d q_ddot/d q analytic, central-FD baseline, d q_ddot/d tau = 1/(mL^2) analytic; >=3 independent anchors), an initial-state-recovery inverse problem, gradient_fields capture. Single-pendulum scope (the n>=2 coupled adjoint is deferred per the Stage-0 WARP-NATIVE-TAPE probe). bit-exact same-stack-same-hw."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "bit-physics-diagnostics",
  "bit-physics-common-warp",
  "articulated-pedagogical",
  "h5py>=3.10",
  "hypothesis>=6.0",
  "numpy>=2.0",
  # Stack-E NVIDIA Warp runtime, consumed transitively via common-warp but
  # listed for the direct `import warp` in the kernel module. Pin mirrors
  # common/common-warp (conventions doc § H.4 re-pin policy).
  "warp-lang>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["articulated_pedagogical_diff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["articulated_pedagogical_diff"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "capture", "capture.*",
  "common_warp", "common_warp.*",
  "determinism", "determinism.*",
  "diagnostics", "diagnostics.*",
  "golden", "golden.*",
  "property", "property.*",
  "articulated_pedagogical", "articulated_pedagogical.*",
  "h5py", "h5py.*",
  "hypothesis", "hypothesis.*",
  "warp", "warp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
  # Strict-warnings posture mirroring articulated-pedagogical / mpm-multimaterial-stack-e:
  # Warp 1.13.0 emits no Python Warning reaching pytest's gate under -W error.
  "error",
]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }
bit-physics-common-warp = { workspace = true }
articulated-pedagogical = { workspace = true }
