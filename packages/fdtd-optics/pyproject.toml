[project]
name = "fdtd-optics"
version = "0.0.0"
description = "Phase 6 — 2D TMz Yee FDTD optics (TF/SF + analytic goldens) f64 reference"
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "bit-physics-diagnostics",
  "numpy>=2.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fdtd_optics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
