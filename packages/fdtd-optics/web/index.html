    <style>
      /* Pre-bundle paint only — the canon is common-web/src/theme.css,
         imported by src/main.ts and bundled by Vite. */
      html, body { margin: 0; height: 100%; background: #06090d; }
      #view { width: min(92vmin, 780px); height: auto; touch-action: none; }
      .fo-explain, .fo-verify {
        position: relative; margin: 10px auto; width: min(92vmin, 780px);
        font: 13px/1.55 system-ui, sans-serif; color: #b7c7d6;
        background: #0a1017; border: 1px solid #17222e; border-radius: 8px;
        padding: 8px 14px;
      }
      .fo-explain summary, .fo-verify summary {
        cursor: pointer; font-weight: 600; color: #d7e4f0; padding: 4px 0;
      }
      .fo-honesty li { border-left: 3px solid #b08c2e; padding-left: 10px;
        margin: 8px 0; }
      .fo-vcard { font: 12px/1.6 ui-monospace, monospace; color: #8fa8bd;
        background: #0d141c; border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
      .fo-vrow { display: flex; gap: 8px; align-items: baseline; padding: 4px 0;
        border-bottom: 1px dotted #14202c; flex-wrap: wrap; }
      .fo-vrow button { flex: none; }
      .fo-vrow span { font: 12px/1.5 ui-monospace, monospace; color: #8fa8bd; }
      .fo-pass { color: #7fdc9a !important; }
      .fo-fail { color: #f5a09f !important; }
      .fo-ctl { display: flex; gap: 6px; align-items: center;
        font: 12px/1.6 system-ui, sans-serif; padding: 2px 0; }
      .fo-ctl input[type="range"] { flex: 1; min-width: 90px; }
      .fo-lab { min-width: 118px; color: #9db2c4; }
      .fo-readout { font: 11px/1.4 ui-monospace, monospace; color: #8fa8bd;
        min-width: 34px; text-align: right; }
      .fo-active { outline: 1px solid #4a7d9e; }
      .fo-probe { display: block; border-radius: 6px; margin: 4px 0;
        border: 1px solid #17222e; }
      .fo-nan {
        position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
        z-index: 60; max-width: min(88vw, 560px);
        font: 13px/1.55 system-ui, sans-serif; color: #f3d9a0;
        background: #221607; border: 1px solid #b08c2e; border-radius: 8px;
        padding: 10px 14px;
      }
      .fo-nan button { margin-top: 6px; }
    </style>

    <div id="app" class="bps-stage"><canvas id="view" width="900" height="900" class="bps-canvas"></canvas></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
