[project]
name = "physarum"
version = "0.0.0"
description = "Agent-based sub-phase — physarum sim (Jones 2010; NumPy reference + WGSL Stack B)."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "bit-physics-diagnostics",
  "h5py>=3.10",
  "hypothesis>=6.0",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physarum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }
