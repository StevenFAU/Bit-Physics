[project]
name = "sph-water"
version = "0.0.0"
description = "Phase 1 Stage 2 — DFSPH SPH-water sim (TDD bootstrap)."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sph_water"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
