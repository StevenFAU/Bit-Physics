[project]
name = "pinn-poisson"
version = "0.0.0"
description = "Phase 3 task-7 — FIRST learned-dynamics-CATEGORY sim. Physics-Informed Neural Network (PINN) solving the 2D Poisson equation Du=f on the unit square, Stack E (Warp substrate) + PyTorch. Soft-constraint Raissi-2019 formulation; verified two-pronged vs analytic Poisson (>=3 independent anchors incl. one inhomogeneous f!=0 MMS case) AND a classical finite-difference reference, plus convergence-with-collocation. CPU-only env (Warp-CPU + PyTorch-CPU; GPU-Warp path unexercised)."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "bit-physics-diagnostics",
  "bit-physics-common-warp",
  "h5py>=3.10",
  "hypothesis>=6.0",
  "numpy>=2.0",
  # Sparse linear solve (scipy.sparse + spsolve) for the classical 5-point
  # FD reference, and host-side analytic evaluation. Stack-agnostic oracle.
  "scipy>=1.13",
  # PyTorch: the PINN network + torch.autograd.grad PDE residual (CPU).
  "torch>=2.2",
  # Checkpoint serialization (LFS-tracked; neural-ca precedent).
  "safetensors>=0.4",
  # Stack-E NVIDIA Warp runtime, consumed via common-warp but listed for the
  # direct `import warp` in the torch->wp Capture bridge (infer.py). Pin
  # mirrors common/common-warp (conventions doc § H.4 re-pin policy).
  "warp-lang>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pinn_poisson"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["pinn_poisson"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "capture", "capture.*",
  "common_warp", "common_warp.*",
  "determinism", "determinism.*",
  "diagnostics", "diagnostics.*",
  "property", "property.*",
  "h5py", "h5py.*",
  "hypothesis", "hypothesis.*",
  "scipy", "scipy.*",
  "safetensors", "safetensors.*",
  "torch", "torch.*",
  "warp", "warp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
  "error",
]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
bit-physics-diagnostics = { workspace = true }
bit-physics-common-warp = { workspace = true }
