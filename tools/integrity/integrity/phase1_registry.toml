# Phase 1 testkit-artifact registry (Stage 3 deliverable per charter § 2.3).
#
# Lookup-only registry of every Phase 1 artifact the integrity toolkit
# may reason about. Cat 3 itself discovers golden tables via filesystem
# glob (tools/testkit/golden/tables/*.json — Phase 0 layout); Stage 2's
# subdirectory goldens (per Stage 2 shift #16) are listed here for
# operator-visible enumeration without changing Cat 3 semantics.
#
# Per-sim implementation phases register the Cat 3 evaluator shims
# (tools/integrity/integrity/cat3_numerical/evaluators/<algorithm>.py)
# when the sim's Python reference exists. At Phase 1 close those are
# deferred; this file pins the algorithm names so Phase 2+ knows what
# evaluator-shim filenames to add.

[meta]
phase = 1
stage = 3
landing_audit = "docs/_audits/phase-1/landing-<UTC>.md"
golden_layout = "tools/testkit/golden/tables/<category>/<algorithm>.json"
mms_layout    = "tools/testkit/code_verification/mms/solutions/<sim>/"

# ---- Tier 2 substacks (Stage 1 deliverables) ------------------------

[tier2.particle]
path        = "tools/diagnostics/diagnostics/tier2/particle/"
ic          = "IC-5"
landed_at   = "5258f00"  # commit
check_fns   = ["check_no_overlap", "check_neighbor_list_integrity", "check_momentum_conservation", "check_count_invariance"]

[tier2.vector_field]
path        = "tools/diagnostics/diagnostics/tier2/vector_field/"
ic          = "IC-6"
