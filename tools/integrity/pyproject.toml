[project]
name = "bit-physics-integrity"
version = "0.0.0"
description = "Bit-Physics integrity toolkit — Cat 1–5 + Cat-X checks for citation, contract, numerical, draft-time, provenance, and tolerance-budget integrity."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "jsonschema>=4.20",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "mutmut>=3.0",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["integrity"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["integrity"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "golden", "golden.*",
  "jsonschema", "jsonschema.*",
  "mutmut", "mutmut.*",
  "yaml", "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
