[project]
name = "bit-physics-diagnostics"
version = "0.0.0"
description = "Bit-Physics diagnostic toolchain — Tier 1 universal + Tier 2 data-structure-specific runtime inspection."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "bit-physics-testkit",
  "h5py>=3.10",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diagnostics"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["diagnostics"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "capture", "capture.*",
  "determinism", "determinism.*",
  "h5py", "h5py.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = [
  "diagnostics/tier1/tests",
  "diagnostics/tier2/scalar_field/tests",
]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
