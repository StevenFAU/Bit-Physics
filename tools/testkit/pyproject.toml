[project]
name = "bit-physics-testkit"
version = "0.0.0"
description = "Bit-Physics testkit — capture format, code-verification, determinism, equivalence, golden-value, probes, property-based testing primitives."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "h5py>=3.10",
  "hypothesis>=6.0",
  "jsonschema>=4.20",
  # numba: JIT acceleration for reference-implementation hot inner
  # loops at canonical scale. Added per sub-phase-particle-fluids-
  # sph-water Stage 1 R18 routing: pure-Python NumPy at 1M-particle
  # scale produces ~10⁴-s wall-clock even with scipy.cKDTree; numba
  # JIT lowers the inner math to native code without intermediate
  # array materialization. Declared in testkit (universal workspace
  # dep at HEAD; every sim + integrity + diagnostics + every sub-
  # phase consumer transitively gets numba). Project-wide convention
  # documented at `docs/common/numba.md`: ``@njit(fastmath=False,
  # cache=True)`` mandatory; ``fastmath=True``, unguarded
  # ``parallel=True``, and ``error_model="numpy"`` are banned for
  # determinism preservation. Pinned to a known-good range; bit-
  # exactness across numba versions is not formally guaranteed
  # upstream so the project verifies via the regression test at
  # `tools/testkit/numba_harness/tests/test_numba_determinism.py`.
  "numba>=0.61,<0.66",
  "numpy>=2.0",
  "sympy>=1.13",
]

[project.optional-dependencies]
render-similarity = [
  # Phase-3 sub-phase-phase-3-render-similarity (task-2) Stage 1b
  # additions per charter § 1.1 item 4 / probe §3.2 (WEB-fetched
  # 2026-05-28; sub-phase-phase-3-render-similarity-stage-0-2026-05-
  # 28T12-44-20Z.md §3 verifies un-yanked + 0 advisories).
  #
  # lpips 0.1.4 is the only release on the 0.1.x line (2021-08-25);
  # declares torch>=0.4.0 + torchvision>=0.2.1 + numpy>=1.14.3 +
  # scipy>=1.0.1 + tqdm>=4.28.1 transitives. Used at CPU-only +
  # model.eval() + torch.no_grad() + pinned weights per D-DET.
  "lpips==0.1.4",
  # scikit-image: SSIM via skimage.metrics.structural_similarity
  # (Wang 2004 Eq. 13, D-ANCHOR Anchor 2). >=0.26 carries the
  # current data_range API.
  "scikit-image>=0.26",
  # torch declared explicitly (transitive of lpips; pin within the
  # lpips compat window). >=2.0 keeps wheels available for Py3.12
  # and stays well inside lpips's broad >=0.4.0 floor.
  "torch>=2.0",
]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # pytest-timeout: per-test wall-clock timeout. Lands the requirement
  # documented at docs/conventions/sub-phase-conventions.md § J.3 — numba-using
  # PATH-A mutation targets (e.g. MPM mls_mpm.py) can loop indefinitely or
  # allocate extreme memory under pathological mutations; pytest's own signal
  # handler terminates the offending test before an orphan pytest grandchild
  # reparents past the outer `timeout` command's reach (the § J.3 R15 failure
  # mode). Default per-test ceiling is set in [tool.pytest.ini_options] below;
  # per-target mutmut runners may tighten it.
  "pytest-timeout>=2.0",
  "ruff>=0.5",
  # mutmut pinned to 2.x: Block-5's run-mutation.sh uses
  # `--paths-to-mutate` which was removed in 3.x (config moved to
  # `[tool.mutmut]`). Surfaced at Block 9 LANDING; pin keeps the
  # current orchestrator working without rewriting it inside LANDING.
  "mutmut>=2.5,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capture", "code_verification", "determinism", "equivalence", "golden", "property", "render_similarity"]

# Phase-5 pypi-release: ship the JSON schema data files alongside the Python
# packages. `capture/manifest.py` and `golden/verifier.py` resolve their schemas
# via `Path(__file__).resolve().parent.parent / "schemas"`, which in an installed
# wheel is `<site-packages>/schemas/`. Without this force-include the wheel omits
# the schemas, so capture-writing (every sim's re-emit) raises FileNotFoundError
# in a fresh venv — surfaced by the spec § 3.8 bootstrap-verification gate. The
# force-include lands the files at `<site-packages>/schemas/`, where the existing
# `parent.parent` resolution finds them. Additive packaging metadata only; no code
# or behaviour change. See docs/_audits/phase-5/pypi-release-*.md.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "schemas"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["capture", "code_verification", "determinism", "equivalence", "golden", "property", "render_similarity"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "h5py", "h5py.*",
  "jsonschema", "jsonschema.*",
  "sympy", "sympy.*",
  "hypothesis", "hypothesis.*",
  # render_similarity Stage 1b deps (lpips==0.1.4 + scikit-image>=0.26 + torch).
  # Both lpips and skimage ship without py.typed; torch's stubs are
  # incomplete enough that strict-mode mypy on the metric thin wrappers
  # surfaces only false-positives at the call site.
  "lpips", "lpips.*",
  "skimage", "skimage.*",
  "torch", "torch.*",
  # Phase-4 WU-C ms_ssim multi-scale low-pass uses scipy.ndimage (no py.typed).
  "scipy", "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = ["error"]
# Default per-test wall-clock ceiling (pytest-timeout; conventions § J.3).
# 300 s accommodates capture-generation tests while terminating an
# infinite-loop / runaway-allocation mutation before it orphans (the § J.3
# R15 mode). Unit tests finish far under this; per-target mutmut runners may
# pass a tighter --timeout. Honored when pytest-timeout is installed (dev extra).
timeout = 300
testpaths = [
  "capture/tests",
  "code_verification/mms/tests",
  "determinism/tests",
  "equivalence/tests",
  "golden/tests",
  "property/tests",
  "render_similarity/tests",
]

[tool.uv.sources]
# Workspace member; root pyproject lists this under [tool.uv.workspace].
