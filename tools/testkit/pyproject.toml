[project]
name = "bit-physics-testkit"
version = "0.0.0"
description = "Bit-Physics testkit — capture format, code-verification, determinism, equivalence, golden-value, probes, property-based testing primitives."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
dependencies = [
  "h5py>=3.10",
  "hypothesis>=6.0",
  "jsonschema>=4.20",
  "numpy>=2.0",
  "sympy>=1.13",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capture", "code_verification", "determinism", "equivalence", "property"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["capture", "code_verification", "determinism", "equivalence", "property"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "h5py", "h5py.*",
  "jsonschema", "jsonschema.*",
  "sympy", "sympy.*",
  "hypothesis", "hypothesis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = [
  "capture/tests",
  "code_verification/mms/tests",
  "determinism/tests",
  "equivalence/tests",
  "property/tests",
]

[tool.uv.sources]
# Workspace member; root pyproject lists this under [tool.uv.workspace].
