# Mutation-testing configuration (spec § 2.13).
#
# Per-target thresholds match phase-0-plan.md § 7.5 deliverable 13.
# `run-mutation.sh` reads this file and orchestrates per-target mutmut
# invocations. Phase 0 produces the baseline; CI activation lives in
# `.github/workflows/mutation-testing.yml`.
#
# `runner` is the pytest command passed to `mutmut --runner`. It must
# target only the relevant tests for the target — without it mutmut
# tries to discover the entire repo's tests at the root, which fails on
# workspace-member path resolution. Surfaced at Block 9 LANDING.

[targets.capture]
path      = "tools/testkit/capture"
threshold = 0.90
runner    = "python -m pytest tools/testkit/capture/tests/ -x -q --tb=no"

[targets.code_verification_mms]
path      = "tools/testkit/code_verification/mms"
threshold = 0.80
runner    = "python -m pytest tools/testkit/code_verification/mms/tests/ -x -q --tb=no"
# Phase-4 A3: SOURCE-ONLY (exclude the nested tests/ subtree).
#
# Phase-4.1 foundation-hardening: NARROWED to the heat-1d MMS pipeline this
# target's runner (mms/tests/) actually exercises — derive/analyze/runner/solvers
# + solutions/heat_1d. The three sibling sim-solution dirs (incompressible_ns_2d,
# reaction_diffusion_2d, reaction_diffusion_3d) are class-(iii) OUT-OF-SCOPE here:
# they are driven by their OWN sim packages' runners (packages/eulerian-smoke,
# packages/reaction-diffusion-*), NOT by mms/tests/, and they already carry their
# own dedicated mutmut targets (incompressible_ns_2d_mms, reaction_diffusion_3d_mms).
# Including them double-counted ~327 unkillable mutants (66% of the survivor pool),
# deflating the kill-rate against source this runner cannot exercise. mutmut's
# --paths-to-exclude (mutmut/__main__.py:423 splits on comma; __init__.py:1273
# fnmatches against DIRECTORY names + basenames during the walk) prunes those dirs.
# `tests` stays excluded (A3 source-only). CI posture UNCHANGED (SOFT_WARN advisory,
# spec §2.13); recorded in docs/_audits/phase-4/foundation-hardening-*.md §1.D.
exclude   = "tests,incompressible_ns_2d,reaction_diffusion_2d,reaction_diffusion_3d"

[targets.golden]
path      = "tools/testkit/golden"
threshold = 0.80
runner    = "python -m pytest tools/testkit/golden/tests/ -x -q --tb=no"

[targets.determinism]
path      = "tools/testkit/determinism"
threshold = 0.90
runner    = "python -m pytest tools/testkit/determinism/tests/ -x -q --tb=no"

[targets.equivalence]
path      = "tools/testkit/equivalence"
threshold = 0.85
runner    = "python -m pytest tools/testkit/equivalence/tests/ -x -q --tb=no"

[targets.property]
path      = "tools/testkit/property"
threshold = 0.80
runner    = "python -m pytest tools/testkit/property/tests/ -x -q --tb=no"
# Phase-4 A3: SOURCE-ONLY (exclude the nested tests/ subtree).
#
# Phase-4.1 foundation-hardening: NARROWED to the property-TESTKIT surface this
# target's runner (property/tests/) exercises — harness.py + invariants/ +
# strategies.py. Two class-(iii) OUT-OF-SCOPE buckets (656/739 = 89% of the
# baseline survivors) are excluded:
#  (a) the satellite PBT TEST files (common_3dgs/test_*_pbt.py,
#      common_py_learned/, common_warp_newton/, variant_equivalence/) — these are
#      TEST files (not under tests/, so A3's `tests` glob missed them); mutating
#      test files is the tests-mutation anti-pattern.
#  (b) the per-sim invariant modules (sims/*/invariants.py) — driven by their OWN
#      packages' PBT tests (packages/<sim>/tests/test_pbt_invariants.py), NOT by
#      property/tests/. (SURFACED: these are exercised-but-not-mutation-targeted;
#      per-sim invariant mutation targets are a follow-up.)
# mutmut prunes them by directory name during its walk. CI posture UNCHANGED
# (SOFT_WARN advisory, §2.13); recorded in docs/_audits/phase-4/foundation-hardening-*.md §1.E.
exclude   = "tests,sims,common_3dgs,common_py_learned,common_warp_newton,variant_equivalence"

# R1 (phase-3 close): cat4_draft_time mutates the WHOLE package (path_line +
# grammars b/c), but the prior runner ran ONE adversarial test exercising only
# the does-not-exist branch -> 0.0669 (460/493 survived). Broadened to all three
# grammars' suites (new branch-coverage test_cat4_path_line_assertions for
# grammar a; the existing phrase_in_file / api_shape suites for b/c) plus the
# adversarial case.
[targets.cat4_draft_time]
path      = "tools/integrity/integrity/cat4_draft_time"
threshold = 0.90
runner    = "python -m pytest tools/integrity/tests/test_cat4_path_line_assertions.py tools/integrity/tests/test_cat4_phrase_in_file.py tools/integrity/tests/test_cat4_api_shape.py tools/integrity/tests/test_adversarial_coverage.py::test_cat4_unverified_assertions_detected -x -q --tb=no"

