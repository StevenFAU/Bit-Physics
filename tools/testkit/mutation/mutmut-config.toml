# — sub-phase-continuous-ca-rd3d B17 PATH-A first real-baseline).
# Existing testkit/integrity targets above are UNTOUCHED.
#
# Schema: per-target [targets.<id>] keeping the existing `path` /
# `threshold` / `runner` triple. The runner uses `uv run --no-sync`
# so mutmut's per-mutation subprocess resolves workspace members
# (e.g. `reaction_diffusion_3d` at packages/reaction-diffusion-3d/)
# through the already-built uv-workspace virtualenv. This is the
# specific runner-rework that closed-form + agent-based sub-phases
# deferred.
#
# Threshold rationale: spec § 2.13 prescribes per-target floors;
# the published table at HEAD only enumerates the testkit/integrity
# baseline (above). Sim-source modules carry no spec-pinned floor;
# we adopt 0.80 advisory, consistent with the MMS solution target
# floor for the existing `code_verification_mms` target. The
# mutation gate remains non-blocking (advisory) at this sub-phase
# per inherited closed-form / agent-based rationale; PATH-A's
# contribution is the FIRST REAL BASELINE, not a gate-flip.

[targets.reaction_diffusion_3d]
path      = "packages/reaction-diffusion-3d/reaction_diffusion_3d"
threshold = 0.80
runner    = "uv run --no-sync pytest packages/reaction-diffusion-3d/tests/ -x -q --tb=no"

[targets.reaction_diffusion_3d_mms]
