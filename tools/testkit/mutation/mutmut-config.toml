# Mutation-testing configuration (spec § 2.13).
#
# Per-target thresholds match phase-0-plan.md § 7.5 deliverable 13.
# `run-mutation.sh` reads this file and orchestrates per-target mutmut
# invocations. Phase 0 produces the baseline; CI activation lives in
# `.github/workflows/mutation-testing.yml`.
#
# `runner` is the pytest command passed to `mutmut --runner`. It must
# target only the relevant tests for the target — without it mutmut
# tries to discover the entire repo's tests at the root, which fails on
# workspace-member path resolution. Surfaced at Block 9 LANDING.

[targets.capture]
path      = "tools/testkit/capture"
threshold = 0.90
runner    = "python -m pytest tools/testkit/capture/tests/ -x -q --tb=no"

[targets.code_verification_mms]
path      = "tools/testkit/code_verification/mms"
threshold = 0.80
runner    = "python -m pytest tools/testkit/code_verification/mms/tests/ -x -q --tb=no"

[targets.golden]
path      = "tools/testkit/golden"
threshold = 0.80
runner    = "python -m pytest tools/testkit/golden/tests/ -x -q --tb=no"

[targets.determinism]
path      = "tools/testkit/determinism"
threshold = 0.90
runner    = "python -m pytest tools/testkit/determinism/tests/ -x -q --tb=no"

[targets.equivalence]
path      = "tools/testkit/equivalence"
threshold = 0.85
runner    = "python -m pytest tools/testkit/equivalence/tests/ -x -q --tb=no"

[targets.property]
path      = "tools/testkit/property"
threshold = 0.80
runner    = "python -m pytest tools/testkit/property/tests/ -x -q --tb=no"

[targets.cat4_draft_time]
path      = "tools/integrity/integrity/cat4_draft_time"
threshold = 0.90
runner    = "python -m pytest tools/integrity/tests/test_adversarial_coverage.py::test_cat4_unverified_assertions_detected -x -q --tb=no"

# Per-sim sub-phase additive targets (charter § 4.3 Step 2.7 / § 7.3
# — sub-phase-continuous-ca-rd3d B17 PATH-A first real-baseline).
# Existing testkit/integrity targets above are UNTOUCHED.
#
# Schema: per-target [targets.<id>] keeping the existing `path` /
# `threshold` / `runner` triple. The runner uses `uv run --no-sync`
# so mutmut's per-mutation subprocess resolves workspace members
# (e.g. `reaction_diffusion_3d` at packages/reaction-diffusion-3d/)
# through the already-built uv-workspace virtualenv. This is the
# specific runner-rework that closed-form + agent-based sub-phases
# deferred.
#
# Threshold rationale: spec § 2.13 prescribes per-target floors;
# the published table at HEAD only enumerates the testkit/integrity
# baseline (above). Sim-source modules carry no spec-pinned floor;
# we adopt 0.80 advisory, consistent with the MMS solution target
# floor for the existing `code_verification_mms` target. The
# mutation gate remains non-blocking (advisory) at this sub-phase
# per inherited closed-form / agent-based rationale; PATH-A's
# contribution is the FIRST REAL BASELINE, not a gate-flip.

[targets.reaction_diffusion_3d]
path      = "packages/reaction-diffusion-3d/reaction_diffusion_3d"
threshold = 0.80
runner    = "uv run --no-sync pytest packages/reaction-diffusion-3d/tests/ -x -q --tb=no"

[targets.reaction_diffusion_3d_mms]
path      = "tools/testkit/code_verification/mms/solutions/reaction_diffusion_3d"
threshold = 0.80
runner    = "uv run --no-sync pytest packages/reaction-diffusion-3d/tests/test_mms_convergence.py -x -q --tb=no"

# Optional third target — RD-3D MMS scaffolding (runner.py / analyze.py)
# — DEFERRED per Stage 1 SHIFT S2: the RD-3D MMS test does NOT consume
# the heat-1D-specific `runner.SchemeRunner` / `analyze` scaffolding
# (it inlines its own 3D-grid convergence study), so mutating them
# does not exercise gate-5 for RD-3D. The existing
# `targets.code_verification_mms` block above ALREADY covers
# `tools/testkit/code_verification/mms` (path) against the heat-1D
# tests at `tools/testkit/code_verification/mms/tests/`; adding a
# redundant target here would just re-mutate the same surface
# against the same tests. Plan § 4.3 Step 2.7 authorizes the
# skip-with-rationale; recorded in landing audit § 7.6.

# Per-sim sub-phase additive targets — sub-phase-particle-fluids-sph-water
# B17 PATH-A continue (second proof-point of the per-target runner
# infrastructure established at sub-phase-continuous-ca-rd3d). The
# RD-3D targets above are UNTOUCHED.
#
# Numba-mutation note: sph_water.reference.dfsph contains @njit-
# decorated inner functions (_density_evolution_jit_inner,
# _density_jit_inner) introduced at R18 routing (commit a9f7cf2).
# mutmut mutates Python source; numba JIT-compiles on the next call.
# numba's cache should invalidate when the source bytecode changes
# (cache=True keys off source-hash); mutations should therefore
# propagate through the JIT compile path. Banked as SHIFT N3 in the
# Stage 2 landing audit for posterity (the project's first mutation-
# testing run against @njit-decorated code).
#
# Per-target runner uses the same `uv run --no-sync pytest` shape
# established at RD-3D PATH-A. The runner targets sph-water's
# equivalence + golden + diagnostics tests but EXCLUDES the
# canonical-capture generation (sim_runner_seeded at 100K particles
# is ~21 min; running it ~500x per mutation target would be
# infeasible). The full test suite at packages/sph-water/tests/
# excludes the canonical capture by design — gate-11 determinism uses
# sim_runner_diagnostic (64 particles); the canonical descriptor is
# only exercised by the explicit capture-generation invocation, not
# by pytest.

[targets.sph_water]
path      = "packages/sph-water/sph_water"
threshold = 0.80
runner    = "uv run --no-sync pytest packages/sph-water/tests/ -x -q --tb=no"

[targets.sph_water_dfsph_generator]
path      = "tools/testkit/golden/generator/dfsph_density_evolution.py"
threshold = 0.80
runner    = "uv run --no-sync pytest packages/sph-water/tests/test_dfsph_density_golden.py -x -q --tb=no"

# Per-sim sub-phase additive targets — sub-phase-eulerian-smoke B17
# PATH-A continue (third proof-point of the per-target runner
# infrastructure established at sub-phase-continuous-ca-rd3d). The
# RD-3D and sph-water targets above are UNTOUCHED.
#
# Eulerian-smoke source target covers the Stam-Fedkiw stable-fluids
# kernel + sim runner + invariants (semi-Lagrangian advection,
# MacCormack corrector, Jacobi pressure projection, 3D smoke pipeline,
# 2D lid-driven cavity, PBT invariants). The runner targets the full
# test suite at packages/eulerian-smoke/tests/ — gate-11 determinism
# uses sim_runner_diagnostic (32³ × 10 steps; ~1-2 s per call), so
# pytest invocation per mutation is fast and gate-11 acts as the
# kill-signal for any kernel mutation that breaks bit-exact behaviour.
# MMS convergence study (~3 s) acts as the gate-5 kill-signal for
# any mutation breaking 2nd-order accuracy.
#
# Numba-mutation note: eulerian_smoke.reference.stable_fluids does
# NOT use @njit at this sub-phase (pure NumPy + np.roll suffices per
# Stage 0 Task 0.4 wall-clock budget). The numba-cache propagation
# concern documented at sph-water Stage 2 N3 therefore does NOT apply
# to eulerian-smoke; if a Phase-2+ optimisation introduces @njit, the
# cache-invalidation discipline carries forward via conventions doc § G.
#
# Optional third target — NS-2D MMS scaffolding — SKIPPED per Path-Y
# operator routing (plan § 1.2 + § 4.2 step 3): the eulerian-smoke
# MMS convergence study is INLINED at packages/eulerian-smoke/tests/
# test_mms_convergence.py, not via `tools/testkit/code_verification/
# mms/runner.py`. There is no NS-2D MMS scaffolding-specific to
# mutate; the existing `targets.code_verification_mms` covers the
# heat-1D runner surface against the heat-1D tests. Mirrors RD-3D
# PATH-A's identical-rationale third-target skip.

[targets.eulerian_smoke]
path      = "packages/eulerian-smoke/eulerian_smoke"
threshold = 0.80
runner    = "uv run --no-sync pytest packages/eulerian-smoke/tests/ -x -q --tb=no"

[targets.incompressible_ns_2d_mms]
path      = "tools/testkit/code_verification/mms/solutions/incompressible_ns_2d"
threshold = 0.80
runner    = "uv run --no-sync pytest packages/eulerian-smoke/tests/test_mms_convergence.py -x -q --tb=no"
