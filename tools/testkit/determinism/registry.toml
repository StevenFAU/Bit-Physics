# Determinism registry (spec § 2.5 / phase-3-plan §3.2.5).
#
# Per-sim determinism declarations introduced as a Phase-3 surface
# (phase-3-plan §3.2.5; docs/phases/phase-3-plan.md:461-505). Prior sims declare
# determinism in their capture manifests' `determinism` block (see
# tools/testkit/determinism/policy.md); this registry is the new central,
# operator-visible table each Phase-3 task appends a row to. Created by Phase-3
# task-1 (sub-phase-phase-3-common-3dgs) with the first row.
#
# Row schema (phase-3-plan §3.2.5):
#   stack       = "<A|B|C|D|E>"
#   class       = "<bit-exact | distributional | non-deterministic>"
#   scope       = "<same-stack-same-hw | same-stack-any-hw | cross-stack | n/a>"
#   atomic_ops  = "<none | sum-only | full>"
#   subgroup_ops= "<none | warp-level | full>"
#   seed_pinned = <true | false>
#   distributional_bound = "<EFECT | n/a>"   # required iff class = distributional

# common-3dgs forward renderer (task-1). D-C default declaration drafted at
# Stage 1a; MEASURED + CONFIRMED at Stage 1b — render() run twice on identical
# inputs is byte-identical (max_abs_diff = 0.0, identical sha256). The renderer
# composites per-pixel front-to-back over a depth-sorted splat list (no atomic
# scatter, no subgroup ops) → bit-identical run-to-run on the Warp CPU backend
# (serial wp.launch). The bit-exact declaration HOLDS; not re-characterized
# (no STOP-J fired). Row locked at Stage 1c.
[neural-rendered.common-3dgs]
stack = "E"
class = "bit-exact"
scope = "same-stack-same-hw"
atomic_ops = "none"
subgroup_ops = "none"
seed_pinned = true

# lenia (task-3, sub-phase-phase-3-lenia). FIRST SIM in Phase 3 (after the two
# infrastructure roots common-3dgs at task-1 + render-similarity at task-2).
# D-DET lean per charter §7.3 + §3.2.5 pre-baked row schema
# (docs/phases/phase-3-plan.md:479-486): bit-exact same-stack-same-hw via
# Taichi seed; no atomics in forward conv. **MEASURED at Stage 1b**: two runs
# at seed=42, grid=64, steps=10 produce np.array_equal field outputs under
# set_taichi_deterministic(arch='cpu'). The Stack-D Taichi-DSL real-space
# Quad4 convolution is per-cell (no ti.atomic_*; no cross-cell accumulator;
# explicit f64 accumulator in lenia_convolve to avoid Taichi 1.7.4's silent
# f32 downcast). Row locked at Stage 1b.
[continuous-ca.lenia]
stack = "D"
class = "bit-exact"
scope = "same-stack-same-hw"
atomic_ops = "none"
subgroup_ops = "none"
seed_pinned = true

# ising-classical (task-3a, sub-phase-phase-3-ising-classical). FIRST
# `lattice-spin.*` row + FIRST Stack-B SIM row in Phase 3 (after lenia's
# continuous-ca Stack-D row). D-WEBGPU-DET per charter §5 + §3.2.5 schema:
# bit-exact same-stack-same-hw via PCG per-cell seed + deterministic
# checkerboard (red/black) update order; no atomics, no subgroup ops.
# **MEASURED at Stage 1b**: run_twice_and_diff(sim_runner_seeded, seed=42)
# on the NumPy reference (128sq, T=2.27, 10000 sweeps) produces
# np.array_equal spin captures (Layer-1 oracle, max_abs_diff = 0.0). The
# WGSL parallel-Metropolis kernel exercises the same checkerboard PCG
# posture locally (Layer-2, spec §7.8 CI no-GPU). Row locked at Stage 1b.
[lattice-spin.ising-classical]
stack = "B"
class = "bit-exact"
scope = "same-stack-same-hw"
atomic_ops = "none"
subgroup_ops = "none"
seed_pinned = true

# articulated-pedagogical (task-4, sub-phase-phase-3-rigid-body). FIRST
# `rigid-body.*` row + FIRST Stack-E SIM row in Phase 3. D-DET per charter §6 +
# §3.2.5 schema: bit-exact same-stack-same-hw via the Warp CPU serial `wp.launch`
# (single-threaded reduction order) + `dtype=wp.float64` throughout (no atomics,
# no subgroup ops) — the Warp analog of Taichi `cpu_max_num_threads=1`, shared
# with mpm-multimaterial-stack-e / common-3dgs. The ABA forward-dynamics
# recursion is a fixed-size 3-vector / 3x3-matrix loop over n links; no atomic
# scatter, no neighbor search. **DEFAULT declaration drafted at Stage 1a;
# MEASURED at Stage 1b** via `assert_deterministic_run` (two runs byte-equal).
# Row locked at Stage 1b.
[rigid-body.articulated-pedagogical]
stack = "E"
class = "bit-exact"
scope = "same-stack-same-hw"
atomic_ops = "none"
subgroup_ops = "none"
seed_pinned = true

# mass-spring-cloth (task-5, sub-phase-phase-3-mass-spring-cloth). FIRST
# `soft-body.*` row + FIRST Stack-C SIM row in Phase 3 (RD-2D-Stack-C is a
# Phase-1 port, not a new Phase-3 sim). D-DET (charter §6, operator-ratified):
# do NOT pre-declare bit-exact — MEASURE. The XPBD constraint projection runs as
# a SERIAL Gauss-Seidel sweep in a SINGLE Vulkan invocation (local_size 1, one
# workgroup) over a FIXED constraint order — no atomic scatter, no subgroup ops,
# f64, `precise` (NoContraction). On the lavapipe CPU backend (VK_DRIVER_FILES=
# lvp_icd.json, LP_NUM_THREADS=0) this is the bit-exact-same-hw realization (the
# enum has no `same-driver` value; the lavapipe-ICD pin is the realization
# mechanism, documented in spec-ref §6 + the capture sidecar). **DEFAULT
# declaration drafted at Stage 1a; MEASURED at Stage 1b** via
# `assert_deterministic_run(tolerance=0.0)` (two runs byte-equal). If a tractable
# 128x128 capture forces parallel/atomic GS and bit-exactness breaks, this row is
# re-characterized honestly (closed-with-shifted) — NOT silently kept.
[soft-body.mass-spring-cloth]
stack = "C"
class = "bit-exact"
scope = "same-stack-same-hw"
atomic_ops = "none"
subgroup_ops = "none"
seed_pinned = true

# neural-ca (task-6, sub-phase-phase-3-neural-ca). SIXTH Phase-3 sub-phase +
# FIRST dual-stack + FIRST learned-dynamics sim. D-DET (charter §6, operator-
# ratified): TWO rows, MEASURE-then-declare. Training and inference are kept
# SEPARATE — bit-exact fits inference only. DEFAULT rows drafted at Stage 1a;
# MEASURED + locked at Stage 1b-D (training-loss distribution across pinned
# seeds derives the EFECT bound; run_twice_and_diff confirms inference
# bit-exactness). If the EFECT bound is underivable → STOP-EFECT (re-characterize
# per the ising STOP-DET template). NOTE the registry-schema guideline
# "distributional_bound required iff class = distributional": training is
# non-deterministic BY DESIGN (the trained WEIGHTS are not reproducible run-to-run
# — stochastic fire mask + optimizer atomics), yet the training-LOSS CONVERGENCE
# is distributionally bounded by EFECT. The class/bound pairing is finalized at
# Stage 1b-D on measurement (may reconcile class→distributional if a tight band
# is derived). The EFECT bound characterizes TRAINING-convergence reproducibility
# — it is NOT the cross-stack gate (that is the D↔B render-similarity, § 9).
# MEASURED at Stage 1b-D (5 pinned seeds, representative disk-pool config):
# final-loss CV 0.21, tail-smoothed CV 0.085, 3σ upper 0.0653 (locked 0.07 in
# tolerance.toml `training_loss_3sigma_upper`). Distribution BOUNDED → EFECT
# derivable, NO STOP-EFECT. Class kept `non-deterministic` (trained weights are
# seed-dependent); the bounded loss is the EFECT band.
[continuous-ca.neural-ca.training]
stack = "D"
class = "non-deterministic"
scope = "n/a"
atomic_ops = "full"
subgroup_ops = "none"
seed_pinned = true
distributional_bound = "EFECT"

# Inference (frozen checkpoint forward pass) — bit-exact same-stack-same-hw with
# a pinned RNG seed for the stochastic fire mask; no atomics, no subgroup ops in
# the forward convs on the PyTorch CPU backend. This single-stack reproducibility
# is the FOUNDATION for the D↔B statistical cross-stack gate.
[continuous-ca.neural-ca.inference]
stack = "D"
class = "bit-exact"
scope = "same-stack-same-hw"
atomic_ops = "none"
subgroup_ops = "none"
seed_pinned = true

# pinn-poisson (task-7, sub-phase-phase-3-pinn-poisson). SEVENTH Phase-3 sub-phase
# + FIRST learned-dynamics-CATEGORY sim. D-DET (charter §6, operator-ratified):
# TWO rows, MEASURE-then-declare at Stage 1b-PINN. Training and inference are kept
# SEPARATE — bit-exact fits inference only. DEFAULT rows drafted here at Stage 1a.
# The env is CPU-only (no CUDA), so the CUDA-atomic non-determinism worry is moot
# (atomic_ops = "none"). MEASURED at Stage 1b-PINN (locked config units=60/n3000/
# lbfgs2000): same-seed CPU training is BIT-IDENTICAL (two independent seed-42 runs
# -> byte-equal field, max_abs_diff 0.0; the committed checkpoint reproduces a fresh
# seed-42 train) — the NCA same-seed-bit-identical finding TRANSFERS. Class kept
# `non-deterministic` (mirrors neural-ca): the trained WEIGHTS are seed-DEPENDENT
# (different seeds -> different weights), which is the learned-dynamics distributional
# character; the same-seed reproducibility is captured by `seed_pinned = true`. The
# EFECT band is DERIVED from the across-seed training-loss distribution: 5 pinned
# seeds {42,11,22,33,44} -> mean 2.37e-6, std 6.89e-7, CV 0.290, 3σ upper 4.44e-6
# (locked 5e-6 in tolerance.toml). Distribution BOUNDED -> EFECT derivable, NO
# STOP-EFECT. CRITICAL: the EFECT bound characterizes TRAINING reproducibility — it
# is NOT the acceptance gate (the analytic + FD verification on the frozen network
# are the load-bearing gates; a STOP-EFECT would NOT block them).
[learned-dynamics.pinn-poisson.training]
stack = "E"
class = "non-deterministic"
scope = "n/a"
atomic_ops = "none"
subgroup_ops = "none"
seed_pinned = true
distributional_bound = "EFECT"

# Inference (frozen-network forward evaluation on the eval grid). bit-exact
# same-stack-same-hw — frozen weights make inference a deterministic function
