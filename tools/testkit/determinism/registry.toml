# Determinism registry (spec § 2.5 / phase-3-plan §3.2.5).
#
# Per-sim determinism declarations introduced as a Phase-3 surface
# (phase-3-plan §3.2.5; docs/phases/phase-3-plan.md:461-505). Prior sims declare
# determinism in their capture manifests' `determinism` block (see
# tools/testkit/determinism/policy.md); this registry is the new central,
# operator-visible table each Phase-3 task appends a row to. Created by Phase-3
# task-1 (sub-phase-phase-3-common-3dgs) with the first row.
#
# Row schema (phase-3-plan §3.2.5):
#   stack       = "<A|B|C|D|E>"
#   class       = "<bit-exact | distributional | non-deterministic>"
#   scope       = "<same-stack-same-hw | same-stack-any-hw | cross-stack | n/a>"
#   atomic_ops  = "<none | sum-only | full>"
#   subgroup_ops= "<none | warp-level | full>"
#   seed_pinned = <true | false>
#   distributional_bound = "<EFECT | n/a>"   # required iff class = distributional

# common-3dgs forward renderer (task-1). D-C default declaration drafted at
# Stage 1a; MEASURED + CONFIRMED at Stage 1b — render() run twice on identical
# inputs is byte-identical (max_abs_diff = 0.0, identical sha256). The renderer
# composites per-pixel front-to-back over a depth-sorted splat list (no atomic
# scatter, no subgroup ops) → bit-identical run-to-run on the Warp CPU backend
# (serial wp.launch). The bit-exact declaration HOLDS; not re-characterized
# (no STOP-J fired). Row locked at Stage 1c.
[neural-rendered.common-3dgs]
stack = "E"
class = "bit-exact"
scope = "same-stack-same-hw"
atomic_ops = "none"
subgroup_ops = "none"
seed_pinned = true

# lenia (task-3, sub-phase-phase-3-lenia). FIRST SIM in Phase 3 (after the two
# infrastructure roots common-3dgs at task-1 + render-similarity at task-2).
# D-DET lean per charter §7.3 + §3.2.5 pre-baked row schema
# (docs/phases/phase-3-plan.md:479-486): bit-exact same-stack-same-hw via
# Taichi seed; no atomics in forward conv. **MEASURED at Stage 1b**: two runs
# at seed=42, grid=64, steps=10 produce np.array_equal field outputs under
# set_taichi_deterministic(arch='cpu'). The Stack-D Taichi-DSL real-space
# Quad4 convolution is per-cell (no ti.atomic_*; no cross-cell accumulator;
# explicit f64 accumulator in lenia_convolve to avoid Taichi 1.7.4's silent
# f32 downcast). Row locked at Stage 1b.
[continuous-ca.lenia]
stack = "D"
class = "bit-exact"
scope = "same-stack-same-hw"
atomic_ops = "none"
subgroup_ops = "none"
seed_pinned = true

# ising-classical (task-3a, sub-phase-phase-3-ising-classical). FIRST
# `lattice-spin.*` row + FIRST Stack-B SIM row in Phase 3 (after lenia's
# continuous-ca Stack-D row). D-WEBGPU-DET per charter §5 + §3.2.5 schema:
# bit-exact same-stack-same-hw via PCG per-cell seed + deterministic
# checkerboard (red/black) update order; no atomics, no subgroup ops.
# **MEASURED at Stage 1b**: run_twice_and_diff(sim_runner_seeded, seed=42)
# on the NumPy reference (128sq, T=2.27, 10000 sweeps) produces
# np.array_equal spin captures (Layer-1 oracle, max_abs_diff = 0.0). The
# WGSL parallel-Metropolis kernel exercises the same checkerboard PCG
# posture locally (Layer-2, spec §7.8 CI no-GPU). Row locked at Stage 1b.
[lattice-spin.ising-classical]
stack = "B"
class = "bit-exact"
scope = "same-stack-same-hw"
atomic_ops = "none"
subgroup_ops = "none"
seed_pinned = true

# articulated-pedagogical (task-4, sub-phase-phase-3-rigid-body). FIRST
# `rigid-body.*` row + FIRST Stack-E SIM row in Phase 3. D-DET per charter §6 +
# §3.2.5 schema: bit-exact same-stack-same-hw via the Warp CPU serial `wp.launch`
# (single-threaded reduction order) + `dtype=wp.float64` throughout (no atomics,
# no subgroup ops) — the Warp analog of Taichi `cpu_max_num_threads=1`, shared
# with mpm-multimaterial-stack-e / common-3dgs. The ABA forward-dynamics
# recursion is a fixed-size 3-vector / 3x3-matrix loop over n links; no atomic
# scatter, no neighbor search. **DEFAULT declaration drafted at Stage 1a;
# MEASURED at Stage 1b** via `assert_deterministic_run` (two runs byte-equal).
# Row locked at Stage 1b.
[rigid-body.articulated-pedagogical]
stack = "E"
class = "bit-exact"
scope = "same-stack-same-hw"
atomic_ops = "none"
subgroup_ops = "none"
seed_pinned = true
