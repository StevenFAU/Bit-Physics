# BIT-IDENTICAL at Stage 1b-PINN (the frozen model evaluated twice -> byte-equal;
# the torch->wp->Capture bridge preserves f64 exactly). Declaration HOLDS.
[learned-dynamics.pinn-poisson.inference]
stack = "E"
class = "bit-exact"
scope = "same-stack-same-hw"
atomic_ops = "none"
subgroup_ops = "none"
seed_pinned = true

