# Cross-stack equivalence tolerance table (spec § 2.6).
#
# Per-category default tolerances; per-sim overrides may tighten or loosen
# these values. Overrides must remain inside `tolerance-budget.toml`'s caps
# (Cat-X HARD_FAIL otherwise; Block-5 INTEGRITY enforces).
#
# Schema (validated by `equivalence.harness.load_tolerance_table`):
#   [defaults.<category>]
#     relative = <float>
#     absolute = <float>
#   [overrides.<sim-name>]
#     category = <string>     # required
#     relative = <float>      # optional; falls back to defaults.<category>.relative
#     absolute = <float>      # optional; falls back to defaults.<category>.absolute
#
# Category names mirror spec § 2.6 default tolerance table.

[defaults.closed_form]
relative = 1e-5
absolute = 0.0

[defaults.reaction-diffusion]
relative = 1e-4
absolute = 0.0

[defaults.sph]
relative = 1e-4
absolute = 0.0

[defaults.mpm]
relative = 1e-4
absolute = 0.0

[defaults.smoke]
relative = 1e-4
absolute = 0.0

[defaults.lbm]
relative = 1e-5
absolute = 0.0

# No per-sim overrides at Phase 0 close. Block 8 (RD-2D) and Phase 1+ sims
# may add entries here; each addition is gated by tolerance-budget.toml.

[overrides.reaction-diffusion-2d]
category = "reaction-diffusion"
# Resolves sim.category='continuous-ca' (physics-family taxonomy)
# to tolerance-category='reaction-diffusion' (numerical-method taxonomy).
# AT-BUDGET per [defaults.reaction-diffusion]: relative=1e-4, absolute=0.0.
# NOT a tolerance widening per spec § 2.6 — resolution wiring only.
# Established by sub-phase-reaction-diffusion-2d-stack-d Stage 1c.

[overrides.sph-water]
category = "sph"
# Resolves sim.category='particle-fluids' (physics-family taxonomy)
# to tolerance-category='sph' (numerical-method taxonomy).
# AT-BUDGET per [defaults.sph]: relative=1e-4, absolute=0.0.
# NOT a tolerance widening per spec § 2.6 — resolution wiring only.
# Established by sub-phase-sph-water-stack-d Stage 1c.
# Second per-sim override after sub-phase-reaction-diffusion-2d-stack-d.

[overrides.lattice-boltzmann-d3q19]
category = "lbm"
# Resolves sim.category='lattice' (physics-family taxonomy)
# to tolerance-category='lbm' (numerical-method taxonomy).
# AT-BUDGET per [defaults.lbm]: relative=1e-5, absolute=0.0.
# NOT a tolerance widening per spec § 2.6 — resolution wiring only.
# Established by sub-phase-lattice-boltzmann-d3q19-stack-d Stage 1c.
# Third per-sim override after sub-phase-reaction-diffusion-2d-stack-d
# + sub-phase-sph-water-stack-d.
# 10x tighter cross-stack tolerance than the prior two ports (1e-4 -> 1e-5).

[overrides.mpm-multimaterial]
category = "mpm"
# Resolves sim.category='hybrid-pg' (physics-family taxonomy)
# to tolerance-category='mpm' (numerical-method taxonomy).
# AT-BUDGET per [defaults.mpm]: relative=1e-4, absolute=0.0.
# NOT a tolerance widening per spec § 2.6 — resolution wiring only.
# Established by sub-phase-mpm-multimaterial-stack-d Stage 1c.
# Fourth per-sim override after reaction-diffusion-2d + sph-water + lattice-boltzmann-d3q19.
# Same 1e-4 tolerance as RD-2D + sph-water (looser than LBM's 1e-5).
