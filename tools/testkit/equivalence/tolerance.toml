# Cross-stack equivalence tolerance table (spec § 2.6).
#
# Per-category default tolerances; per-sim overrides may tighten or loosen
# these values. Overrides must remain inside `tolerance-budget.toml`'s caps
# (Cat-X HARD_FAIL otherwise; Block-5 INTEGRITY enforces).
#
# Schema (validated by `equivalence.harness.load_tolerance_table`):
#   [defaults.<category>]
#     relative = <float>
#     absolute = <float>
#   [overrides.<sim-name>]
#     category = <string>     # required
#     relative = <float>      # optional; falls back to defaults.<category>.relative
#     absolute = <float>      # optional; falls back to defaults.<category>.absolute
#
# Category names mirror spec § 2.6 default tolerance table.

[defaults.closed_form]
relative = 1e-5
absolute = 0.0

[defaults.reaction-diffusion]
relative = 1e-4
absolute = 0.0

[defaults.sph]
relative = 1e-4
absolute = 0.0

[defaults.mpm]
relative = 1e-4
absolute = 0.0

[defaults.smoke]
relative = 1e-4
absolute = 0.0

[defaults.lbm]
relative = 1e-5
absolute = 0.0

# No per-sim overrides at Phase 0 close. Block 8 (RD-2D) and Phase 1+ sims
# may add entries here; each addition is gated by tolerance-budget.toml.

[overrides.reaction-diffusion-2d]
category = "reaction-diffusion"
# Resolves sim.category='continuous-ca' (physics-family taxonomy)
# to tolerance-category='reaction-diffusion' (numerical-method taxonomy).
# AT-BUDGET per [defaults.reaction-diffusion]: relative=1e-4, absolute=0.0.
# NOT a tolerance widening per spec § 2.6 — resolution wiring only.
# Established by sub-phase-reaction-diffusion-2d-stack-d Stage 1c.

[overrides.sph-water]
category = "sph"
# Resolves sim.category='particle-fluids' (physics-family taxonomy)
# to tolerance-category='sph' (numerical-method taxonomy).
# AT-BUDGET per [defaults.sph]: relative=1e-4, absolute=0.0.
# NOT a tolerance widening per spec § 2.6 — resolution wiring only.
# Established by sub-phase-sph-water-stack-d Stage 1c.
# Second per-sim override after sub-phase-reaction-diffusion-2d-stack-d.

[overrides.lattice-boltzmann-d3q19]
category = "lbm"
# Resolves sim.category='lattice' (physics-family taxonomy)
# to tolerance-category='lbm' (numerical-method taxonomy).
# AT-BUDGET per [defaults.lbm]: relative=1e-5, absolute=0.0.
# NOT a tolerance widening per spec § 2.6 — resolution wiring only.
# Established by sub-phase-lattice-boltzmann-d3q19-stack-d Stage 1c.
# Third per-sim override after sub-phase-reaction-diffusion-2d-stack-d
# + sub-phase-sph-water-stack-d.
# 10x tighter cross-stack tolerance than the prior two ports (1e-4 -> 1e-5).

[overrides.mpm-multimaterial]
category = "mpm"
# Resolves sim.category='hybrid-pg' (physics-family taxonomy)
# to tolerance-category='mpm' (numerical-method taxonomy).
# AT-BUDGET per [defaults.mpm]: relative=1e-4, absolute=0.0.
# NOT a tolerance widening per spec § 2.6 — resolution wiring only.
# Established by sub-phase-mpm-multimaterial-stack-d Stage 1c.
# Fourth per-sim override after reaction-diffusion-2d + sph-water + lattice-boltzmann-d3q19.
# Same 1e-4 tolerance as RD-2D + sph-water (looser than LBM's 1e-5).

[overrides.eulerian-smoke]
category = "smoke"
# Resolves sim.category='volumetric-grid' (physics-family taxonomy)
# to tolerance-category='smoke' (numerical-method taxonomy).
# AT-BUDGET per [defaults.smoke]: relative=1e-4, absolute=0.0.
# NOT a tolerance widening per spec § 2.6 — resolution wiring only.
# Established by sub-phase-eulerian-smoke-stack-d Stage 1.
# FIFTH per-sim override after reaction-diffusion-2d + sph-water
# + lattice-boltzmann-d3q19 + mpm-multimaterial.
# Same 1e-4 tolerance as RD-2D + sph-water + mpm (looser than LBM's 1e-5).
# Cross-stack-non-trivial surface: the fixed-cap (n_jacobi=20) Jacobi
# pressure-projection FP-accumulation (deferred IC-15 aspect #5, in its
# determinism-safe fixed-iteration-count form — D5).

# -----------------------------------------------------------------------------
# Phase-3 render-similarity thresholds (D-SCHEMA Stage-1a lean; SCHEMA ONLY).
# -----------------------------------------------------------------------------
# Section family: `[render_similarity.<category>.<sim>]` with keys
# `psnr_min` (dB floor), `ssim_min` ([0,1] floor), `lpips_max` (ceiling, ≥0).
# §3.2.2 contract; §2.12 quality floors PSNR≥28 / SSIM≥0.85 / LPIPS≤0.15.
# Validated by `tolerance-schema.json` under top-level `render_similarity`.
#
# render-similarity (task-2) ships the SCHEMA only. Per-sim rows are added by
# the CONSUMING sim sub-phases (task-6 NCA D↔B equivalence; task-8 MPM-3DGS
# golden-render gate) at their own dispatch. Adding a row here without a
# consumer is OUT OF SCOPE for this sub-phase (charter § 1.2).

# -----------------------------------------------------------------------------
# Phase-3 lenia (task-3, sub-phase-phase-3-lenia) — golden-table tolerances.
# -----------------------------------------------------------------------------
# Single-stack sim (Stack D, Taichi); NO cross-stack equivalence row (so the
# `overrides.<sim>` shape — which carries cross-stack relative/absolute
# resolution wiring — does not fit semantically and has no per-anchor key
# slots for `golden_kernel_*` / `golden_trajectory_*`).
#
# Schema landed under top-level `[golden_tolerance.<category>.<sim>]`
# (lenia-tolerance-schema-fix; mirrors the `render_similarity` additive-
# extension shape from sub-phase-phase-3-render-similarity Stage 1a).
#
# Per §3.2.4 pre-baked schema (docs/phases/phase-3-plan.md:426-433):
#   golden_kernel_abs     = 1e-6  (Quad4 kernel anchor absolute tolerance)
#   golden_kernel_rel     = 1e-5  (Quad4 kernel anchor relative tolerance)
#   golden_trajectory_abs = 1e-4  (Orbium trajectory anchor absolute tolerance)
# tolerance-budget.toml at HEAD has only `cross_stack` budgets; NO
# `[budgets.<category>.golden]` cap shape exists. Lenia's rows land
# un-capped-by-design (Stage-0 audit FRICTION #1; STOP-CAT-X NOT fired).
# Operator routing options at the landing review.

[golden_tolerance.continuous-ca.lenia]
golden_kernel_abs = 1e-6
golden_kernel_rel = 1e-5
golden_trajectory_abs = 1e-4

# Phase-3 ising-classical (task-3a, sub-phase-phase-3-ising-classical) —
# golden-table / MC-observable tolerances. Single-stack sim (Stack B;
# NumPy reference is the in-stack oracle, NO cross-stack equivalence pair),
# so the `overrides.<sim>` shape — which is `additionalProperties: false`
# admitting only category/relative/absolute — REJECTS the sim-specific
# named keys `critical_temp_rel` + `magnetization_rel` (D-TOL-SCHEMA
# resolved-on-evidence at Stage 1b: the schema validator forbids additive
# keys under `[overrides.<sim>]`; STOP-S NOT fired because NO new branch is
# needed — the existing `golden_tolerance` branch, established by
# lenia-tolerance-schema-fix, already admits bespoke per-(category, sim)
# numeric keys for single-stack sims). Mirrors `[golden_tolerance.continuous-ca.lenia]`.
#
# Per §6.3a M.5 (docs/phases/phase-3-plan.md:1517-1521):
#   critical_temp_rel = 1e-3  (finite-size shift ~1/L at L=128; closed-form
#                              cross-anchor agreement Onsager/KW/textbook)
#   magnetization_rel = 5e-2  (Monte-Carlo statistical error at ~10^4 sweeps;
#                              aligned-IC ordered-phase |m| vs Yang m(T))
# tolerance-budget.toml at HEAD has only `cross_stack` budgets; NO
# `[budgets.lattice-spin.*]` cap shape exists, so these land off-budget
# by-design (D-WIDE-TOL lean confirmed; L-LTSF-3; STOP-CAT-X NOT fired).
[golden_tolerance.lattice-spin.ising-classical]
critical_temp_rel = 1e-3
magnetization_rel = 5e-2

# Phase-3 articulated-pedagogical (task-4, sub-phase-phase-3-rigid-body) —
# golden-table tolerances. Single-stack sim (Stack E; first rigid-body sim).
# D-TOL (charter §6, operator-ratified): land under the existing
# `[golden_tolerance.<category>.<sim>]` branch per §S.3 — NO new schema branch
# (the lenia-tolerance-schema-fix branch's description ENUMERATES these exact
# keys for articulated-pedagogical), NO `[budgets.rigid-body.cross_stack]` cap
# (single-stack terminal sim, no cross-stack pair — like common-3dgs / lenia /
# ising), NO §2.6 amendment. §S.2 discharged: read tolerance-schema.json
# golden_tolerance branch + the lenia/ising entries before writing this row.
#
#   pendulum_period_rel        = 1e-3  (large-angle exact period vs analytic
#                                       elliptic K — A1/A2 anchors)
#   trajectory_abs             = 1e-2  (theta(t) Jacobi-cn + double-pendulum
#                                       Cartesian + 6-DOF energy)
#   energy_drift_rel_per_second = 1e-3 (symplectic-Euler secular drift bound)
[golden_tolerance.rigid-body.articulated-pedagogical]
pendulum_period_rel = 1e-3
trajectory_abs = 1e-2
energy_drift_rel_per_second = 1e-3

# Phase-3 mass-spring-cloth (task-5, sub-phase-phase-3-mass-spring-cloth) —
# golden-table tolerances. FIRST `soft-body.*` row. Single-stack sim (Stack C;
# Vulkan/C++ XPBD), no cross-stack equivalence pair (no gate-14). D-TOL (charter
# §6, RESOLVED-IN-CHARTER per §S.3): land under the existing
# `[golden_tolerance.<category>.<sim>]` branch — §S.3 ENUMERATES exactly these
# two keys for mass-spring-cloth; NO new schema branch, NO
# `[budgets.soft-body.cross_stack]` cap, NO §2.6 amendment. §S.2 discharged:
# read tolerance-schema.json golden_tolerance branch + the lenia/ising/rigid-body
# entries before writing this row.
#
#   catenary_shape_rel = 2e-3  (hanging chain vs the analytic catenary, relative
#                               to sag depth; MEASURED stiff-limit residual — the
