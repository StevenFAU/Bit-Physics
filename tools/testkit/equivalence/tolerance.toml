# NO new schema branch, NO `[budgets.*]` cap.
[golden_tolerance.continuous-ca.neural-ca-python]
golden_checkpoint_match = true
golden_checkpoint_l2_max = 0.03
training_loss_distributional_bound = "EFECT"
training_loss_3sigma_upper = 0.07

