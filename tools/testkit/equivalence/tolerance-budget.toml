# Tolerance budget for the current phase.
# Per-category caps on cross-stack tolerance.
# Per-sim overrides in tolerance.toml that exceed these caps trigger
# Cat-X HARD_FAIL.
# Amendments require a separate operator-approved commit per
# docs/architecture.md § 2.6.

# Phase-4 carryover (WU-P, Stage 1; phase-4-plan §7.1). Carry-forward only —
# NO per-category budget widened. Phase-4 variant tolerances are gated by WU-F's
# `assert_within_budget` against these caps (phase-4-plan §4.2.F / §7.7); any
# widening requires a separate operator-approved tolerance-budget-amendment
# commit per docs/architecture.md §2.6.
[phase]
phase = "phase-4"
opened_at = "2026-05-30T18-54-53Z"

