# Canonical pyproject template for a Bit-Physics sim PyPI package (Phase 5 § 6.3).
#
# Every Stack-D / Stack-E sim's pyproject.toml SHOULD instantiate this shape.
# `lint.py` enforces the required fields. NOTE the namespace: spec § 4.6 calls
# for `bit-physics-<category>-<sim>`, but the shipped sims use plain names
# (e.g. `ising-classical`); the namespace divergence is a documented SHIFTED
# finding (Phase 5 does not rename sims) — reserve the namespace at go-live.

[project]
name = "bit-physics-<category>-<sim>"          # spec § 4.6 (SHIFTED: sims ship plain names)
version = "0.0.0"                               # single source of truth = repo semver
description = "<one-line sim description>"
readme = "README.md"
license = { file = "../../LICENSE" }            # must match the repo MIT license (§ 12.7)
authors = [{ name = "Steven Cohen" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  # Declare explicitly (lint enforces non-empty). Workspace infra siblings
  # (bit-physics-testkit, bit-physics-diagnostics, bit-physics-common-*) are
  # resolved from the local wheelhouse during the fresh-venv bootstrap.
  "bit-physics-testkit",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.5"]

# A `[project.scripts]` console-script is OPTIONAL (R1): the bootstrap re-emit is
# programmatic via the sim's `sim_runner_seeded` / `default_capture` surface, not
# a CLI. Add one only for end-user convenience.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["<import_name>"]

[tool.uv.sources]
bit-physics-testkit = { workspace = true }
